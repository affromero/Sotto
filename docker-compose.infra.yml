# Infrastructure services — long-lived, rarely restarted on deploy.
# Managed separately from app services for zero-downtime deploys.
#
# Usage: docker compose -f docker-compose.infra.yml up -d

services:
  kittentts:
    build:
      context: ./services/kittentts
      dockerfile: Dockerfile
    container_name: sotto-prod-kittentts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      sotto-network:
        aliases:
          - kittentts
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  pinchtab:
    image: pinchtab/pinchtab
    container_name: sotto-prod-pinchtab
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      BRIDGE_BIND: '0.0.0.0'
      BRIDGE_PORT: '9867'
      BRIDGE_HEADLESS: 'true'
      BRIDGE_STEALTH: 'full'
      BRIDGE_BLOCK_IMAGES: 'true'
      BRIDGE_BLOCK_ADS: 'true'
      BRIDGE_BLOCK_MEDIA: 'true'
      BRIDGE_NAV_TIMEOUT: '25'
    shm_size: '1gb'
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:9867/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      sotto-network:
        aliases:
          - pinchtab
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  remotion:
    image: ghcr.io/affromero/sotto-remotion:latest
    build:
      context: .
      dockerfile: services/remotion/Dockerfile
    container_name: sotto-prod-remotion
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    shm_size: '2gb'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      sotto-network:
        aliases:
          - remotion
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

networks:
  sotto-network:
    name: sotto-network
    driver: bridge
