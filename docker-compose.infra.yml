# Infrastructure services — long-lived, rarely restarted on deploy.
# Managed separately from app services for zero-downtime deploys.
#
# Usage: docker compose -f docker-compose.infra.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sotto-prod-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sotto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sotto}
    volumes:
      - sotto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sotto}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sotto-network:
        aliases:
          - postgres
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: sotto-prod-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - sotto_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      sotto-network:
        aliases:
          - redis
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  kittentts:
    build:
      context: ./services/kittentts
      dockerfile: Dockerfile
    container_name: sotto-prod-kittentts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      sotto-network:
        aliases:
          - kittentts
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  pinchtab:
    image: pinchtab/pinchtab
    container_name: sotto-prod-pinchtab
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      BRIDGE_BIND: '0.0.0.0'
      BRIDGE_PORT: '9867'
      BRIDGE_HEADLESS: 'true'
      BRIDGE_STEALTH: 'full'
      BRIDGE_BLOCK_IMAGES: 'true'
      BRIDGE_BLOCK_ADS: 'true'
      BRIDGE_BLOCK_MEDIA: 'true'
      BRIDGE_NAV_TIMEOUT: '25'
    shm_size: '1gb'
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:9867/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      sotto-network:
        aliases:
          - pinchtab
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

  remotion:
    image: ghcr.io/affromero/sotto-remotion:latest
    build:
      context: .
      dockerfile: services/remotion/Dockerfile
    container_name: sotto-prod-remotion
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    shm_size: '2gb'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      sotto-network:
        aliases:
          - remotion
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

volumes:
  sotto_postgres_data:
  sotto_redis_data:

networks:
  sotto-network:
    name: sotto-network
    driver: bridge
