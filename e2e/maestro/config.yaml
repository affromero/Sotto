flows:
  - 'flows/**'
executionOrder:
  continueOnFailure: true
onFlowStart:
  file: hooks/onFlowStart.yaml
onFlowComplete:
  file: hooks/onFlowComplete.yaml
env:
  TEST_EMAIL: 'test-e2e@example.com'
  E2E_PODCAST_ID: 'e2e-podcast'
  E2E_EMPTY_EMAIL: 'test-empty@example.com'
  E2E_FAILED_PODCAST_ID: 'e2e-failed-podcast'
  E2E_DRAFT_NAME: 'Draft Podcast'
