appId: fm.sotto.app
tags:
  - player
  - deep-link
---
# Deep Link — Open podcast via sotto:// URL scheme, verify player loads

- runFlow: ../helpers/login.yaml

# Open a deep link to the seeded podcast
- openLink: "sotto://podcast/${E2E_PODCAST_ID}"

# Verify player loads
- extendedWaitUntil:
    visible:
      id: "player-play-pause"
    timeout: 10000
- assertVisible:
    id: "player-play-pause"

- takeScreenshot: deep-link-player
