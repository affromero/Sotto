appId: fm.sotto.app
name: Auth - Login and Verify Library
tags: [auth, critical]
---
- extendedWaitUntil:
    visible:
      id: 'login-email-input'
    timeout: 10000
- runFlow: ../helpers/login.yaml
- assertVisible:
    id: 'library-filter-all'
- assertVisible:
    id: 'library-episode-list'
- takeScreenshot: after-login
- assertWithAI: 'A private episode library with at least one episode card is visible'
