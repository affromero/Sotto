appId: fm.sotto.app
name: Voice Marketplace - Search and Sort
tags: [voices, marketplace]
---
- runFlow: ../helpers/login.yaml

# Navigate to voice marketplace via settings
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- tapOn:
    id: "settings-voice-marketplace"
- extendedWaitUntil:
    visible:
      id: "voice-marketplace-list"
    timeout: 5000

# Search for a voice
- tapOn:
    id: "voice-marketplace-search-input"
- inputText: "deep voice"

# Change sort order
- tapOn:
    id: "voice-marketplace-search-clear"
- tapOn:
    id: "voice-marketplace-sort-recent"
