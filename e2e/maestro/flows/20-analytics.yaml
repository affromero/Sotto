appId: fm.sotto.app
name: Analytics - Period Selection and Stats
tags: [analytics]
---
- runFlow: ../helpers/login.yaml

# Navigate to analytics via settings
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- tapOn:
    id: "settings-analytics"
- extendedWaitUntil:
    visible:
      id: "analytics-stats-grid"
    timeout: 5000

# Test period selector
- tapOn:
    id: "analytics-period-7d"
- tapOn:
    id: "analytics-period-30d"
- tapOn:
    id: "analytics-period-all"

# Terminal assertion: engagement section visible
- assertVisible:
    id: "analytics-engagement-card"
- takeScreenshot: analytics-screen
