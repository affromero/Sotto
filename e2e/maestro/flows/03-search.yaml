appId: fm.sotto.app
name: Search - Private Library
tags: [search, smoke]
---
- runFlow: ../helpers/login.yaml

# Navigate to Search tab
- tapOn:
    text: 'Search'

# Type a search query
- tapOn:
    id: 'search-input'
- inputText: 'artificial intelligence'
- extendedWaitUntil:
    visible:
      id: 'search-results-list'
    timeout: 3000

# Terminal assertion: search results visible
- assertVisible:
    id: 'search-results-list'
- takeScreenshot: search-results
