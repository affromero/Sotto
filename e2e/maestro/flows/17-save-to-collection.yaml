appId: fm.sotto.app
name: Save - Toggle Save on Episode
tags: [player, save]
---
- runFlow: ../helpers/login.yaml

# Scroll to seeded episode in library
- extendedWaitUntil:
    visible:
      id: 'library-episode-list'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'episode-card-${E2E_EPISODE_ID}'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'episode-card-${E2E_EPISODE_ID}'
- extendedWaitUntil:
    visible:
      id: 'player-save-button'
    timeout: 5000

# Toggle save on
- tapOn:
    id: 'player-save-button'

# Toggle save off
- tapOn:
    id: 'player-save-button'

# Terminal assertion: save button still visible
- assertVisible:
    id: 'player-save-button'
- takeScreenshot: save-toggled
