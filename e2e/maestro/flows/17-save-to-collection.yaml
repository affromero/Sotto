appId: fm.sotto.app
name: Save - Toggle Save on Podcast
tags: [player, save]
---
- runFlow: ../helpers/login.yaml

# Scroll to seeded podcast in feed
- extendedWaitUntil:
    visible:
      id: "feed-podcast-list"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "podcast-card-${E2E_PODCAST_ID}"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "podcast-card-${E2E_PODCAST_ID}"
- extendedWaitUntil:
    visible:
      id: "player-save-button"
    timeout: 5000

# Toggle save on
- tapOn:
    id: "player-save-button"

# Toggle save off
- tapOn:
    id: "player-save-button"

# Terminal assertion: save button still visible
- assertVisible:
    id: "player-save-button"
- takeScreenshot: save-toggled
