appId: fm.sotto.app
tags:
  - settings
---
# Theme Switch — Toggle between light, dark, and system themes

- runFlow: ../helpers/login.yaml

# Navigate to settings
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-scroll"
    timeout: 3000

# Scroll to theme section
- scrollUntilVisible:
    element:
      id: "settings-theme-dark"
    direction: DOWN
    timeout: 5000

# Switch to dark
- tapOn:
    id: "settings-theme-dark"
- wait: 500

# Switch to light
- tapOn:
    id: "settings-theme-light"
- wait: 500

# Switch to system
- tapOn:
    id: "settings-theme-system"
- wait: 500

# Verify settings screen is still stable
- assertVisible:
    id: "settings-scroll"

- takeScreenshot: theme-switch
