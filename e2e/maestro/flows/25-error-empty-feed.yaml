appId: fm.sotto.app
name: Error - Empty Feed State
tags: [error]
---
# Login as user with no followed topics (empty feed)
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
- tapOn:
    id: "login-email-input"
- inputText: "test-empty@sotto.fm"
- tapOn:
    id: "login-sign-in-button"

# Verify empty-state UI renders
- extendedWaitUntil:
    visible:
      id: "feed-empty-state"
    timeout: 10000
- assertVisible:
    id: "feed-empty-state"
