appId: fm.sotto.app
name: User Profile - View and Follow
tags: [social, profile]
---
- runFlow: ../helpers/login.yaml

# Search for the other test user
- tapOn:
    text: "Search"
- tapOn:
    id: "search-input"
- inputText: "${E2E_OTHER_USER_HANDLE}"
- tapOn:
    id: "search-mode-people"

# Wait for results and tap on user
- extendedWaitUntil:
    visible:
      text: "${E2E_OTHER_USER_NAME}"
    timeout: 5000
- tapOn:
    text: "${E2E_OTHER_USER_NAME}"

# Verify profile loaded
- extendedWaitUntil:
    visible:
      id: "user-profile-follow-button"
    timeout: 5000
- assertVisible:
    id: "user-profile-name"

# Follow the user
- tapOn:
    id: "user-profile-follow-button"

# Unfollow the user (toggle back)
- tapOn:
    id: "user-profile-follow-button"

# Terminal assertion: follow button still visible
- assertVisible:
    id: "user-profile-follow-button"
- takeScreenshot: user-profile
