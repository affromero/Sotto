appId: fm.sotto.app
name: Player - Playback Controls
tags: [player, smoke]
---
- runFlow: ../helpers/login.yaml

# Scroll to and tap seeded episode
- scrollUntilVisible:
    element:
      id: 'episode-card-${E2E_EPISODE_ID}'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'episode-card-${E2E_EPISODE_ID}'
- extendedWaitUntil:
    visible:
      id: 'player-play-pause'
    timeout: 5000
- assertWithAI: 'An audio player with playback controls is visible'

# Play / Pause
- tapOn:
    id: 'player-play-pause'
- tapOn:
    id: 'player-play-pause'

# Skip controls
- tapOn:
    id: 'player-skip-forward'
- tapOn:
    id: 'player-skip-back'

# Speed cycling
- tapOn:
    id: 'player-speed-button'
- tapOn:
    id: 'player-speed-button'

# Save toggle
- tapOn:
    id: 'player-save-button'
- tapOn:
    id: 'player-save-button'

# Share
- tapOn:
    id: 'player-share-button'

# Terminal assertion: player still functional
- assertVisible:
    id: 'player-play-pause'
- takeScreenshot: player-controls
