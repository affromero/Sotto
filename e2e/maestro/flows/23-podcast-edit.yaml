appId: fm.sotto.app
name: Podcast Edit - Update Metadata
tags: [podcast, edit]
---
- runFlow: ../helpers/login.yaml

# Navigate to own podcast from profile
- tapOn:
    text: "Profile"
- extendedWaitUntil:
    visible:
      id: "profile-podcast-list"
    timeout: 5000
- tapOn:
    text: "E2E Test Podcast"
- extendedWaitUntil:
    visible:
      id: "player-play-pause"
    timeout: 5000

# Tap edit button (owner should see it)
- tapOn:
    text: "Edit"
- extendedWaitUntil:
    visible:
      id: "podcast-edit-title-input"
    timeout: 5000

# Edit title
- clearText:
    id: "podcast-edit-title-input"
- tapOn:
    id: "podcast-edit-title-input"
- inputText: "Updated E2E Title"

# Change visibility
- tapOn:
    id: "podcast-edit-visibility-unlisted"

# Save changes
- tapOn:
    id: "podcast-edit-save-button"
