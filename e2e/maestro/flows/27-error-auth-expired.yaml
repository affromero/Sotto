appId: fm.sotto.app
name: Error - Session Expiry Redirect
tags: [error]
---
- runFlow: ../helpers/login.yaml

# Verify we're on the feed
- assertVisible:
    id: "feed-podcast-list"

# Clear app state to simulate session expiry
- clearState: fm.sotto.app
- launchApp
- waitForAnimationToEnd

# After state clear, app should redirect to login
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
- assertVisible:
    id: "login-email-input"
- takeScreenshot: session-expired
