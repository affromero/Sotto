appId: fm.sotto.app
name: Library - Browse and Navigate
tags: [library, critical]
---
- runFlow: ../helpers/login.yaml

# Toggle library filters
- tapOn:
    id: 'library-filter-ready'
- extendedWaitUntil:
    visible:
      id: 'library-podcast-list'
    timeout: 3000

- tapOn:
    id: 'library-filter-all'
- extendedWaitUntil:
    visible:
      id: 'library-podcast-list'
    timeout: 5000

# Private filter should render without leaving the library
- tapOn:
    id: 'library-filter-private'
- tapOn:
    id: 'library-filter-all'

# Scroll until seeded podcast is visible
- scrollUntilVisible:
    element:
      id: 'podcast-card-${E2E_PODCAST_ID}'
    direction: DOWN
    timeout: 10000

# Tap seeded podcast card to open player
- tapOn:
    id: 'podcast-card-${E2E_PODCAST_ID}'

# Terminal assertion: player loaded
- extendedWaitUntil:
    visible:
      id: 'player-play-pause'
    timeout: 5000
- assertVisible:
    id: 'player-play-pause'
- takeScreenshot: library-to-player
