appId: fm.sotto.app
name: Library - Browse and Navigate
tags: [library, critical]
---
- runFlow: ../helpers/login.yaml

# Toggle library filters
- tapOn:
    id: 'library-filter-ready'
- extendedWaitUntil:
    visible:
      id: 'library-episode-list'
    timeout: 3000

- tapOn:
    id: 'library-filter-all'
- extendedWaitUntil:
    visible:
      id: 'library-episode-list'
    timeout: 5000

# Private filter should render without leaving the library
- tapOn:
    id: 'library-filter-private'
- tapOn:
    id: 'library-filter-all'

# Scroll until seeded episode is visible
- scrollUntilVisible:
    element:
      id: 'episode-card-${E2E_EPISODE_ID}'
    direction: DOWN
    timeout: 10000

# Tap seeded episode card to open player
- tapOn:
    id: 'episode-card-${E2E_EPISODE_ID}'

# Terminal assertion: player loaded
- extendedWaitUntil:
    visible:
      id: 'player-play-pause'
    timeout: 5000
- assertVisible:
    id: 'player-play-pause'
- takeScreenshot: library-to-player
