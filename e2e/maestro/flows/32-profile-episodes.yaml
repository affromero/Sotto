appId: fm.sotto.app
tags:
  - profile
---
# Profile Episodes — Verify own episode list, tap a episode to open player

- runFlow: ../helpers/login.yaml

# Go to profile tab
- tapOn:
    text: "Profile"
- extendedWaitUntil:
    visible:
      id: "profile-episode-list"
    timeout: 5000
- assertVisible:
    id: "profile-episode-list"

# Verify our seeded episode is listed
- scrollUntilVisible:
    element:
      id: "episode-card-${E2E_EPISODE_ID}"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "episode-card-${E2E_EPISODE_ID}"

# Verify player opens
- extendedWaitUntil:
    visible:
      id: "player-play-pause"
    timeout: 5000
- assertVisible:
    id: "player-play-pause"

- takeScreenshot: profile-episode-opened
