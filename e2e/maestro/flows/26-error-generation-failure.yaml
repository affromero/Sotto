appId: fm.sotto.app
name: Error - Generation Failure UI
tags: [error]
---
- runFlow: ../helpers/login.yaml

# Scroll to seeded FAILED-status podcast
- scrollUntilVisible:
    element:
      id: "podcast-card-${E2E_FAILED_PODCAST_ID}"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "podcast-card-${E2E_FAILED_PODCAST_ID}"

# Verify error UI and retry button
- extendedWaitUntil:
    visible:
      id: "generation-error"
    timeout: 5000
- assertVisible:
    id: "generation-retry-button"
- takeScreenshot: generation-failure
