appId: fm.sotto.app
name: Create - Script Regeneration
tags: [create, script, smoke]
---
- runFlow: ../helpers/login.yaml

# Start creation flow
- tapOn:
    text: "Create"
- extendedWaitUntil:
    visible:
      id: "create-chat-input"
    timeout: 5000

# Select a topic chip to start discovery
- tapOn:
    id: "create-inspire-button"
- extendedWaitUntil:
    visible:
      id: "create-ready-card"
    timeout: 15000

# Proceed to voice selection
- tapOn:
    id: "create-next-voices-button"
- extendedWaitUntil:
    visible:
      id: "create-generate-script-button"
    timeout: 5000

# Generate script
- tapOn:
    id: "create-generate-script-button"
- retry:
    maxRetries: 2
    commands:
      - extendedWaitUntil:
          visible:
            id: "script-approve-button"
          timeout: 30000

# Regenerate script instead of approving
- tapOn:
    id: "script-regenerate-button"
- retry:
    maxRetries: 2
    commands:
      - extendedWaitUntil:
          visible:
            id: "script-approve-button"
          timeout: 30000

# Terminal assertion: script approve button visible after regeneration
- assertVisible:
    id: "script-approve-button"
- takeScreenshot: script-regenerated
