appId: fm.sotto.app
name: Player - Teleprompter Toggle
tags: [player, teleprompter]
---
- runFlow: ../helpers/login.yaml

# Scroll to seeded episode in library
- extendedWaitUntil:
    visible:
      id: 'library-episode-list'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'episode-card-${E2E_EPISODE_ID}'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'episode-card-${E2E_EPISODE_ID}'
- extendedWaitUntil:
    visible:
      id: 'player-play-pause'
    timeout: 5000

# Toggle teleprompter on
- tapOn:
    id: 'player-teleprompter-toggle'

# Toggle teleprompter off
- tapOn:
    id: 'player-teleprompter-toggle'

# Terminal assertion: player still functional
- assertVisible:
    id: 'player-play-pause'
- takeScreenshot: teleprompter-toggled
