appId: fm.sotto.app
name: Interrupt - Ask Question During Playback
tags: [interrupt, critical]
---
- runFlow: ../helpers/login.yaml

# Scroll to and tap seeded episode
- scrollUntilVisible:
    element:
      id: "episode-card-${E2E_EPISODE_ID}"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "episode-card-${E2E_EPISODE_ID}"
- extendedWaitUntil:
    visible:
      id: "player-play-pause"
    timeout: 5000
- tapOn:
    id: "player-play-pause"

# Wait for playback to start
- extendedWaitUntil:
    visible:
      id: "player-progress-bar"
    timeout: 3000

# Tap the question button — should pause playback
- tapOn:
    id: "player-question-button"
- extendedWaitUntil:
    visible:
      id: "player-question-input"
    timeout: 3000

# Type and submit a question
- tapOn:
    id: "player-question-input"
- inputText: "How does this technology actually work?"
- tapOn:
    id: "player-question-submit"

# Wait for the AI answer (LLMock provides deterministic response)
- extendedWaitUntil:
    visible:
      text: "Great question"
    timeout: 15000

# Dismiss the question panel
- tapOn:
    id: "player-question-cancel"
    optional: true

# Verify we're back to the player
- assertVisible:
    id: "player-play-pause"
