appId: fm.sotto.app
name: Episode Edit - Update Metadata
tags: [episode, edit]
---
- runFlow: ../helpers/login.yaml

# Navigate to own episode from profile
- tapOn:
    text: "Profile"
- extendedWaitUntil:
    visible:
      id: "profile-episode-list"
    timeout: 5000

# Scroll to seeded episode in profile list
- scrollUntilVisible:
    element:
      id: "episode-card-${E2E_EPISODE_ID}"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "episode-card-${E2E_EPISODE_ID}"
- extendedWaitUntil:
    visible:
      id: "player-play-pause"
    timeout: 5000

# Tap edit button (owner should see it)
- tapOn:
    id: "player-edit-button"
- extendedWaitUntil:
    visible:
      id: "episode-edit-title-input"
    timeout: 5000

# Edit title
- clearText:
    id: "episode-edit-title-input"
- tapOn:
    id: "episode-edit-title-input"
- inputText: "Updated E2E Title"

# Change visibility
- tapOn:
    id: "episode-edit-visibility-unlisted"

# Save changes
- tapOn:
    id: "episode-edit-save-button"

# Terminal assertion: save acknowledged (Alert dialog)
- takeScreenshot: episode-edited
