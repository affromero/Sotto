appId: fm.sotto.app
name: MiniPlayer - Persistence Across Tabs
tags: [player, smoke]
---
- runFlow: ../helpers/login.yaml

# Scroll to and play seeded episode
- scrollUntilVisible:
    element:
      id: 'episode-card-${E2E_EPISODE_ID}'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'episode-card-${E2E_EPISODE_ID}'
- extendedWaitUntil:
    visible:
      id: 'player-play-pause'
    timeout: 5000
- tapOn:
    id: 'player-play-pause'

# Navigate back to Library tab
- back
- extendedWaitUntil:
    visible:
      id: 'library-episode-list'
    timeout: 5000

# MiniPlayer should be visible
- assertVisible:
    id: 'mini-player'
- assertVisible:
    id: 'mini-player-play-pause'

# Tap MiniPlayer to return to player
- tapOn:
    id: 'mini-player'

# Terminal assertion: player visible
- extendedWaitUntil:
    visible:
      id: 'player-play-pause'
    timeout: 5000
- assertVisible:
    id: 'player-play-pause'
- takeScreenshot: mini-player-return
