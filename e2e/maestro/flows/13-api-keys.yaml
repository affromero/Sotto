appId: fm.sotto.app
name: Settings - API Keys Management
tags: [settings, api-keys]
---
- runFlow: ../helpers/login.yaml

# Navigate to settings > API keys
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- tapOn:
    id: "settings-api-keys"
- extendedWaitUntil:
    visible:
      id: "api-keys-scroll"
    timeout: 3000

# Verify provider sections are visible
- assertVisible:
    text: "Anthropic"
- assertVisible:
    text: "OpenAI"
