appId: fm.sotto.app
name: Create - Resume Saved Draft
tags: [create, draft]
---
- runFlow: ../helpers/login.yaml

# Navigate to create tab
- tapOn:
    text: "Create"
- extendedWaitUntil:
    visible:
      id: "create-chat-input"
    timeout: 5000

# Look for draft section and tap on the saved draft
- tapOn:
    text: "${E2E_DRAFT_NAME}"

# Terminal assertion: create screen loaded with draft context
- extendedWaitUntil:
    visible:
      id: "create-chat-input"
    timeout: 5000
- assertVisible:
    id: "create-chat-input"
- takeScreenshot: draft-resumed
