appId: fm.sotto.app
tags:
  - library
---
# Pull to Refresh — Swipe down on library to trigger refresh

- runFlow: ../helpers/login.yaml

# Verify library is loaded
- extendedWaitUntil:
    visible:
      id: 'library-podcast-list'
    timeout: 5000

# Pull to refresh by swiping down
- swipe:
    direction: DOWN
    duration: 500

# Wait for library to settle after refresh
- extendedWaitUntil:
    visible:
      id: 'library-podcast-list'
    timeout: 10000
- assertVisible:
    id: 'library-podcast-list'

# Verify podcast card still visible after refresh
- scrollUntilVisible:
    element:
      id: 'podcast-card-${E2E_PODCAST_ID}'
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: 'podcast-card-${E2E_PODCAST_ID}'

- takeScreenshot: library-refreshed
