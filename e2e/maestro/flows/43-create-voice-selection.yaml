appId: fm.sotto.app
tags:
  - create
  - voices
---
# Create Voice Selection — Full voice/TTS/duration/visibility configuration flow

- runFlow: ../helpers/login.yaml

# Start creation
- tapOn:
    text: "Create"
- extendedWaitUntil:
    visible:
      id: "create-chat-input"
    timeout: 5000

# Use a chip to start discovery
- tapOn:
    id: "create-chip-AI & Technology"
- extendedWaitUntil:
    visible:
      id: "create-ready-card"
    timeout: 15000

# Navigate to voice selection step
- tapOn:
    id: "create-next-voices-button"
- extendedWaitUntil:
    visible:
      id: "create-generate-script-button"
    timeout: 5000

# Test format picker — switch to Solo then back to Dialogue
- tapOn:
    id: "voice-format-solo"
- wait: 500
- tapOn:
    id: "voice-format-dialogue"
- wait: 500

# Verify auto-assign is selected by default
- assertVisible:
    id: "voice-auto-assign"

# Test TTS model selector
- tapOn:
    id: "tts-model-trigger"
- wait: 1000
# Close the bottom sheet
- pressKey: back

# Test duration picker
- tapOn:
    id: "duration-5"
- tapOn:
    id: "duration-15"

# Test visibility picker
- tapOn:
    id: "visibility-UNLISTED"
- tapOn:
    id: "visibility-PUBLIC"

# Verify generate button is still available
- assertVisible:
    id: "create-generate-script-button"

- takeScreenshot: voice-selection-configured
