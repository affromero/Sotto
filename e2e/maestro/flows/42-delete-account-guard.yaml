appId: fm.sotto.app
tags:
  - settings
  - error
---
# Delete Account Guard — Tap delete account, cancel confirmation, verify still on settings

- runFlow: ../helpers/login.yaml

# Navigate to settings
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-scroll"
    timeout: 3000

# Scroll to delete account
- scrollUntilVisible:
    element:
      id: "settings-delete-account"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "settings-delete-account"

# Cancel the confirmation alert
- tapOn:
    text: "Cancel"

# Verify still on settings
- assertVisible:
    id: "settings-scroll"

- takeScreenshot: delete-account-cancelled
