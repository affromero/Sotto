appId: fm.sotto.app
name: Fork - Create Remix from Podcast
tags: [fork, critical]
---
- runFlow: ../helpers/login.yaml

# Scroll to seeded podcast in feed
- extendedWaitUntil:
    visible:
      id: "feed-podcast-list"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "podcast-card-${E2E_PODCAST_ID}"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "podcast-card-${E2E_PODCAST_ID}"
- extendedWaitUntil:
    visible:
      id: "player-fork-button"
    timeout: 5000

# Open fork modal
- tapOn:
    id: "player-fork-button"
- extendedWaitUntil:
    visible:
      id: "fork-angle-input"
    timeout: 3000

# Enter fork angle and submit
- tapOn:
    id: "fork-angle-input"
- inputText: "My unique take on this topic"
- tapOn:
    id: "fork-submit-button"

# Terminal assertion: generation started
- extendedWaitUntil:
    visible:
      id: "generation-progress"
    timeout: 10000
- assertVisible:
    id: "generation-progress"
- takeScreenshot: fork-generation-started
