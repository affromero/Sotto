appId: fm.sotto.app
tags:
  - settings
  - referral
---
# Referral Share — Navigate to referral screen, verify link, tap copy and share

- runFlow: ../helpers/login.yaml

# Navigate to settings
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-scroll"
    timeout: 3000

# Open referral screen
- tapOn:
    id: "settings-referral"
- extendedWaitUntil:
    visible:
      id: "referral-copy-button"
    timeout: 3000

# Verify referral link is shown
- assertVisible:
    id: "referral-link-text"

# Tap copy button
- tapOn:
    id: "referral-copy-button"

# Tap share button
- tapOn:
    id: "referral-share-button"

# Dismiss share sheet if it appears
- wait: 2000
- pressKey: back

# Verify still on referral screen
- assertVisible:
    id: "referral-copy-button"

- takeScreenshot: referral-screen
