appId: fm.sotto.app
tags:
  - settings
  - voices
---
# Voice Clones — Navigate to voice clones settings screen, verify it loads

- runFlow: ../helpers/login.yaml

# Navigate to settings
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-scroll"
    timeout: 3000

# Open voice clones
- scrollUntilVisible:
    element:
      id: "settings-voice-clones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "settings-voice-clones"
- extendedWaitUntil:
    visible:
      id: "voices-clone-list"
    timeout: 5000
- assertVisible:
    id: "voices-clone-list"

- takeScreenshot: voice-clones-screen
