appId: fm.sotto.app
name: Collections - Create and Browse
tags: [collections]
---
- runFlow: ../helpers/login.yaml

# Navigate to profile tab where collections are accessible
- tapOn:
    text: "Profile"

# Tap collections link
- tapOn:
    id: "profile-collections-link"
- extendedWaitUntil:
    visible:
      id: "collections-list"
    timeout: 5000

# Create a new collection with unique name
- tapOn:
    id: "collections-add-button"
- extendedWaitUntil:
    visible:
      id: "collections-new-name-input"
    timeout: 3000
- tapOn:
    id: "collections-new-name-input"
- evalScript: ${output.collectionName = 'Test-' + Date.now()}
- inputText: ${output.collectionName}
- tapOn:
    id: "collections-new-save-button"

# Terminal assertion: collection list visible
- extendedWaitUntil:
    visible:
      id: "collections-list"
    timeout: 5000
- takeScreenshot: collection-created
