appId: fm.sotto.app
name: Feed - Browse and Navigate
tags: [feed, critical]
---
- runFlow: ../helpers/login.yaml

# Toggle feed modes
- tapOn:
    id: "feed-mode-activity"
- extendedWaitUntil:
    visible:
      id: "feed-mode-activity"
    timeout: 3000

- tapOn:
    id: "feed-mode-foryou"
- extendedWaitUntil:
    visible:
      id: "feed-podcast-list"
    timeout: 5000

# Tap sort chips
- tapOn:
    id: "feed-sort-recent"
- tapOn:
    id: "feed-sort-popular"
- tapOn:
    id: "feed-sort-trending"

# Scroll the feed
- scroll:
    id: "feed-podcast-list"
    direction: DOWN

# Tap first podcast card to open player
- tapOn:
    id: "podcast-card-0"
    optional: true
