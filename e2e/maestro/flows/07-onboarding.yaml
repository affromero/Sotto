appId: fm.sotto.app
name: Onboarding - New User Flow
tags: [onboarding, smoke]
---
# Assumes a fresh user state (no prior login)
- extendedWaitUntil:
    visible:
      id: 'onboarding-name-input'
    timeout: 10000

# Step 1: Enter name
- tapOn:
    id: 'onboarding-name-input'
- inputText: 'Test User'
- tapOn:
    id: 'onboarding-name-continue'

# Step 2: Select interests (pick first chip)
- extendedWaitUntil:
    visible:
      id: 'onboarding-interests-continue'
    timeout: 5000
- tapOn:
    id: 'onboarding-interest-chip-0'
- tapOn:
    id: 'onboarding-interests-continue'

# Step 3: Done — go to library
- extendedWaitUntil:
    visible:
      id: 'onboarding-done-button'
    timeout: 5000
- tapOn:
    id: 'onboarding-done-button'

# Terminal assertion: landed on library
- extendedWaitUntil:
    visible:
      id: 'library-episode-list'
    timeout: 10000
- assertVisible:
    id: 'library-episode-list'
- takeScreenshot: post-onboarding
