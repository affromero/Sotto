appId: fm.sotto.app
tags:
  - episode
  - edit
  - critical
---
# Episode Delete — Edit episode, delete with confirmation, verify navigation back to library

- runFlow: ../helpers/login.yaml

# Navigate to own episode from profile
- tapOn:
    id: 'profile-settings-button'
    optional: true
- tapOn:
    text: 'Profile'
- extendedWaitUntil:
    visible:
      id: 'profile-episode-list'
    timeout: 5000

- scrollUntilVisible:
    element:
      id: 'episode-card-${E2E_EPISODE_ID}'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'episode-card-${E2E_EPISODE_ID}'

# Open edit screen
- extendedWaitUntil:
    visible:
      id: 'player-edit-button'
    timeout: 5000
- tapOn:
    id: 'player-edit-button'
- extendedWaitUntil:
    visible:
      id: 'episode-edit-title-input'
    timeout: 5000

# Scroll to delete button and tap
- scrollUntilVisible:
    element:
      id: 'episode-edit-delete-button'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'episode-edit-delete-button'

# Dismiss the confirmation alert (Cancel — don't actually delete the seeded episode)
- tapOn:
    text: 'Cancel'

# Verify still on edit screen
- assertVisible:
    id: 'episode-edit-delete-button'

- takeScreenshot: episode-delete-guard
