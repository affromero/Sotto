appId: fm.sotto.app
name: Error - Invalid BYOK API Key
tags: [error]
---
- runFlow: ../helpers/login.yaml

# Navigate to Settings → API Keys
- tapOn:
    text: "Profile"
- tapOn:
    id: "profile-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-api-keys"
    timeout: 5000
- tapOn:
    id: "settings-api-keys"

# Add Anthropic key to expand the input form
- extendedWaitUntil:
    visible:
      id: "api-keys-provider-anthropic"
    timeout: 5000
- tapOn:
    id: "api-keys-add-anthropic"

# Enter an invalid API key
- extendedWaitUntil:
    visible:
      id: "api-keys-input-anthropic"
    timeout: 3000
- tapOn:
    id: "api-keys-input-anthropic"
- inputText: "sk-invalid-key-12345"
- tapOn:
    id: "api-keys-save-anthropic"

# Verify error feedback
- extendedWaitUntil:
    visible:
      id: "api-keys-error-anthropic"
    timeout: 10000
- assertVisible:
    id: "api-keys-error-anthropic"
- takeScreenshot: bad-api-key-error
