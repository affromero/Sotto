appId: fm.sotto.app
tags:
  - create
  - smoke
---
# Create via Typed Topic — Type a custom topic in chat instead of using a chip

- runFlow: ../helpers/login.yaml

# Go to create tab
- tapOn:
    text: "Create"
- extendedWaitUntil:
    visible:
      id: "create-chat-input"
    timeout: 5000

# Type a custom topic
- tapOn:
    id: "create-chat-input"
- inputText: "The history of artificial intelligence and its impact on society"
- tapOn:
    id: "create-send-button"

# Wait for LLMock discovery response
- extendedWaitUntil:
    visible:
      text: "Great choice"
    timeout: 15000

# Verify the ready card appears
- extendedWaitUntil:
    visible:
      id: "create-ready-card"
    timeout: 10000
- assertVisible:
    id: "create-next-voices-button"

- takeScreenshot: typed-topic-discovery
