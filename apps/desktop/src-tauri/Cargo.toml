[package]
name = "sotto-host"
version = "0.2.0"
description = "Sotto Host — desktop launcher for a self-hosted Sotto stack"
authors = ["Sotto"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.77.2"

# The library that main.rs calls into (also the entry point for mobile targets).
[lib]
name = "sotto_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["process", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"

# Backport GHSA-wrw7-89jp-8q8g while Tauri depends on GLib 0.18.
[patch.crates-io]
glib = { git = "https://github.com/affromero/gtk-rs-core", rev = "b4765c59e519d89809e7df0301726b790e258222" }
glib-macros = { git = "https://github.com/affromero/gtk-rs-core", rev = "b4765c59e519d89809e7df0301726b790e258222" }
gtk3-macros = { git = "https://github.com/affromero/gtk3-rs", rev = "0bfa12b9e4d63fadd5f7cb3de610ad299bf084e2" }

[features]
# Enables Tauri's custom-protocol asset serving in release builds.
custom-protocol = ["tauri/custom-protocol"]
