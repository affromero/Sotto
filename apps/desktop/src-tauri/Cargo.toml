[package]
name = "sotto-host"
version = "0.1.0"
description = "Sotto Host — desktop launcher for a self-hosted Sotto stack"
authors = ["Sotto"]
edition = "2021"
rust-version = "1.77.2"

# The library that main.rs calls into (also the entry point for mobile targets).
[lib]
name = "sotto_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enables Tauri's custom-protocol asset serving in release builds.
custom-protocol = ["tauri/custom-protocol"]
