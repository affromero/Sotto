# App services — deployed by blue-green swap.
# deploy.sh builds this image by default so NEXT_PUBLIC_* values are baked from
# the operator env. Set SOTTO_IMAGE_SOURCE=registry to pull the image instead.
#
# Usage:
#   WEB_PORT=3000 docker compose -f docker-compose.app.yml -p sotto-blue up -d
#   WEB_PORT=3010 docker compose -f docker-compose.app.yml -p sotto-green up -d

services:
  web:
    image: ${SOTTO_WEB_IMAGE:-sotto-web}:${SOTTO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - '127.0.0.1:${WEB_PORT:?Set WEB_PORT}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      SOTTO_ACCESS_PASSWORD: ${SOTTO_ACCESS_PASSWORD:-}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?Set BYOK_ENCRYPTION_KEY}
      SOTTO_CREDENTIAL_SYNC_DIR: /run/cli-credentials
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/apps/web/.sotto/storage}
      CLAUDE_HOME: /home/sotto/.claude
      CODEX_HOME: /home/sotto/.codex
    # The agent credential volumes are shared with papernook and flight-finder,
    # whose images run as uid 1000. This container runs as 1001, so it joins
    # their group as a supplementary one; the volume dirs are setgid to it, and
    # the credential files are written 0660. Without this the lineage splits
    # back into one dead copy per app.
    group_add:
      - '1000'
    volumes:
      # Shared with the workers that write it; see docker-compose.workers.yml.
      - storage:/app/apps/web/.sotto/storage
      - cli-credentials:/run/cli-credentials
      - agent-home:/home/sotto/.claude
      - agent-codex-home:/home/sotto/.codex
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/v1/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sotto-network
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

networks:
  sotto-network:
    external: true
    name: sotto-network

volumes:
  # Host-wide, deliberately NOT stack-scoped: the CLIs rotate their refresh token
  # in place and the previous one is retired server-side, so two stacks holding
  # separate copies of one login would kill each other's token. One file, one
  # lineage, shared by every stack on this host.
  agent-home:
    external: true
    name: agent-claude-home
  agent-codex-home:
    external: true
    name: agent-codex-home
  cli-credentials:
    external: true
    name: ${SOTTO_STACK:?Set SOTTO_STACK}-cli-credentials
  # Shared by both blue and green and by the worker stack, so it is named
  # rather than project-scoped. Not external: whichever stack starts first
  # creates it.
  storage:
    name: ${SOTTO_STACK:?Set SOTTO_STACK}-storage
