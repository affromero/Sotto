# App services — deployed by blue-green swap.
# deploy.sh builds this image by default so NEXT_PUBLIC_* values are baked from
# the operator env. Set SOTTO_IMAGE_SOURCE=registry to pull the image instead.
#
# Usage:
#   WEB_PORT=3000 docker compose -f docker-compose.app.yml -p sotto-blue up -d
#   WEB_PORT=3010 docker compose -f docker-compose.app.yml -p sotto-green up -d

services:
  web:
    image: ${SOTTO_WEB_IMAGE:-sotto-web}:${SOTTO_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - '127.0.0.1:${WEB_PORT:?Set WEB_PORT}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      SOTTO_ACCESS_PASSWORD: ${SOTTO_ACCESS_PASSWORD:-}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:?Set BYOK_ENCRYPTION_KEY}
      SOTTO_CREDENTIAL_SYNC_DIR: /run/cli-credentials
      CLAUDE_HOME: /home/sotto/.claude
      CODEX_HOME: /home/sotto/.codex
    volumes:
      - cli-credentials:/run/cli-credentials
      - agent-home:/home/sotto/.claude
      - agent-codex-home:/home/sotto/.codex
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/api/v1/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sotto-network
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

networks:
  sotto-network:
    external: true
    name: sotto-network

volumes:
  # The agent CLIs rotate their OAuth refresh token on every refresh and retire
  # the previous one, so the credentials file has to outlive the container.
  agent-home:
    external: true
    name: ${SOTTO_STACK:?Set SOTTO_STACK}-agent-home
  agent-codex-home:
    external: true
    name: ${SOTTO_STACK:?Set SOTTO_STACK}-agent-codex-home
  cli-credentials:
    external: true
    name: ${SOTTO_STACK:?Set SOTTO_STACK}-cli-credentials
