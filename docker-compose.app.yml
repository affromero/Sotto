# App services — deployed on every push via blue-green swap.
# Parameterized by WEB_PORT for slot isolation.
#
# Usage:
#   WEB_PORT=3000 docker compose -f docker-compose.app.yml -p sotto-blue up -d
#   WEB_PORT=3010 docker compose -f docker-compose.app.yml -p sotto-green up -d

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-dev}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - '127.0.0.1:${WEB_PORT:?Set WEB_PORT}:3000'
    volumes:
      - ./.pitch:/app/apps/web/.pitch:ro
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sotto-network
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

networks:
  sotto-network:
    external: true
    name: sotto-network
