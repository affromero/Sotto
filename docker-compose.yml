version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sotto-postgres
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sotto
    volumes:
      - sotto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sotto-redis
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - '6379:6379'
    volumes:
      - sotto_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  kittentts:
    build:
      context: ./services/kittentts
    container_name: sotto-kittentts
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      - '8100:8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  pinchtab:
    image: pinchtab/pinchtab
    container_name: sotto-pinchtab
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - '9867:9867'
    environment:
      BRIDGE_BIND: '0.0.0.0'
      BRIDGE_PORT: '9867'
      BRIDGE_HEADLESS: 'true'
      BRIDGE_STEALTH: 'full'
      BRIDGE_BLOCK_IMAGES: 'true'
      BRIDGE_BLOCK_ADS: 'true'
      BRIDGE_BLOCK_MEDIA: 'true'
      BRIDGE_NAV_TIMEOUT: '25'
    shm_size: '1gb'
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:9867/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  remotion:
    build:
      context: .
      dockerfile: services/remotion/Dockerfile
    container_name: sotto-remotion
    deploy:
      resources:
        limits:
          memory: 8g
    shm_size: '4gb'
    ports:
      - '3100:3100'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  maps:
    build:
      context: .
      dockerfile: apps/maps/Dockerfile
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    container_name: sotto-maps
    ports:
      - '3002:3002'

volumes:
  sotto_postgres_data:
  sotto_redis_data:
