---
# Setup: uv run pre-commit install --install-hooks
#   (installs BOTH the pre-commit and pre-push hooks; see
#   default_install_hook_types below). /worktree runs this on every worktree.
# See https://pre-commit.com for more information
#
# Local checks cover the staged work. GitHub runs the full source gate before
# publishing verified images. Each hook scopes its stages explicitly.
#   pre-commit: hygiene, lint-staged, affected typechecks/tests, TUI fmt/clippy.
#   pre-push: TUI build/tests for TUI or shared contract changes.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix, lf]
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=2000]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      # --- pre-commit: fast checks on every commit ---
      - id: file-line-count
        name: file line count (< 1000)
        entry: scripts/hooks/check_file_line_count.sh
        language: system
        stages: [pre-commit]
        files: ^(apps|packages|services|tui|scripts|extension|e2e)/.*\.(ts|tsx|js|jsx|mjs|cjs|css|rs|swift|py|sh)$

      - id: dir-file-count
        name: directory file count (new files <= 10)
        entry: scripts/hooks/check_dir_file_count.sh
        language: system
        stages: [pre-commit]
        files: ^(apps|packages|services|tui|scripts|extension|e2e)/.*\.(ts|tsx|js|jsx|mjs|cjs|rs|swift|py|sh)$

      - id: no-secret-files
        name: no local env or key files
        entry: scripts/hooks/check_no_secret_files.sh
        language: system
        stages: [pre-commit]
        files: (^|/)(\.env($|\.)|.*\.(pem|key)$|.*id_rsa.*|.*id_ed25519.*)

      - id: shebang-scripts-executable
        name: shebang scripts are executable
        entry: scripts/hooks/check_shebang_executable.sh
        language: system
        stages: [pre-commit]
        files: ^(apps|packages|services|scripts|tui)/.*\.(ts|tsx|js|jsx|mjs|cjs|rs|swift|py|sh)$

      - id: prisma-validate
        name: prisma validate
        entry: npx prisma validate --schema=apps/web/prisma/schema.prisma
        language: system
        stages: [pre-commit]
        files: ^apps/web/prisma/schema\.prisma$
        pass_filenames: false

      - id: speech-config-check
        name: speech language config check
        entry: npm run speech:config:check --workspace=@sotto/web
        language: system
        stages: [pre-commit]
        files: ^apps/web/src/lib/speech-language-support\.(config\.jsonc?|schema\.json|ts)$
        pass_filenames: false

      - id: lint-staged
        name: lint-staged (eslint + prettier + sort-package-json)
        entry: npx lint-staged --allow-empty
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      # `npm install` silently tolerates package.json declaring a version the
      # lockfile does not carry — min-release-age gates the resolution and says
      # nothing — but `npm ci` refuses that tree, so the break only ever showed
      # up in CI. `npm ci --dry-run` does NOT catch it (it reports "up to date"
      # and exits 0); `npm ls` does, exiting 1 and marking the dependency
      # invalid. `--package-lock-only` reads the lockfile rather than the
      # installed tree, so a stale node_modules cannot fail the commit for
      # unrelated reasons. Runs only when a manifest is staged, needs no
      # network, finishes in under a second.
      - id: lockfile-sync
        name: package.json / lockfile in sync (npm ls)
        entry: npm ls --workspaces --package-lock-only
        language: system
        stages: [pre-commit]
        files: ^(package\.json|package-lock\.json|apps/[^/]+/package\.json|packages/[^/]+/package\.json)$
        pass_filenames: false

      - id: affected-checks
        name: affected typechecks and tests
        entry: node scripts/ci/check-affected.mjs --staged
        language: system
        stages: [pre-commit]
        # Read the staged diff directly because pre-commit omits deleted files.
        always_run: true
        pass_filenames: false

      - id: affected-push-checks
        name: affected TUI build and tests
        entry: node scripts/ci/check-affected.mjs --push
        language: system
        stages: [pre-push]
        # Push refs include renames and deletions; a new branch uses its merge base.
        always_run: true
        pass_filenames: false
