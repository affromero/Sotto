# gitleaks configuration for Sotto.
# Extends the built-in ruleset, then allowlists the places where fake keys,
# example values, and secret references legitimately live: test fixtures, docs,
# CLAUDE.md guidance, env templates, and CI workflows (which reference secrets
# through ${{ secrets.* }}, never literals). Real application source under
# apps/web/src, packages, and scripts is still fully scanned.
[extend]
useDefault = true

[allowlist]
description = "Sotto example, placeholder, fixture, and reference values"
regexes = [
  '''example\.com''',
  '''selfhost\.example\.com''',
  '''<generated>''',
  '''your[-_]?(api[-_]?)?key''',
  '''sk-[a-z]*[-_]?test[-_]?[0-9]*''',
  '''sk-(xxx|placeholder|example|your)''',
  '''changeme''',
  '''replace[-_]?me''',
]
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.oss\.example$''',
  '''(.*/)?package-lock\.json$''',
  '''.*\.test\.(ts|tsx|js|jsx)$''',
  '''.*\.spec\.(ts|tsx|js|jsx)$''',
  '''(.*/)?CLAUDE\.md$''',
  '''docs/.*\.md$''',
  '''\.github/.*\.ya?ml$''',
]
