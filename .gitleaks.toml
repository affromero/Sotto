# gitleaks configuration for Sotto.
# Extends the built-in ruleset and allowlists only explicit placeholder
# patterns. Documentation, tests, environment templates, and workflows are
# scanned like application source because secrets can leak through any file.
[extend]
useDefault = true

[allowlist]
description = "Sotto example, placeholder, fixture, and reference values"
regexes = [
  '''example\.com''',
  '''selfhost\.example\.com''',
  '''<generated>''',
  '''your[-_]?(api[-_]?)?key''',
  '''sk-[a-z]*[-_]?test[-_]?[0-9]*''',
  '''sk-(xxx|placeholder|example|your)''',
  '''changeme''',
  '''replace[-_]?me''',
]
