[project]
name = "sotto-local-piper-tts"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "piper-tts==1.8.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
