version: 2
updates:
  # JavaScript / TypeScript (npm workspaces — the root lockfile covers
  # apps/web, packages/*, and services/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply-chain guard: never open a PR for a release younger than 7 days,
    # so a freshly compromised version is not pulled in immediately.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # TypeScript majors cannot land while typescript-eslint pins
      # `typescript >=4.8.4 <6.1.0` as a peer. npm satisfies that peer by
      # hoisting TS 5.x to the root, so apps/web resolves 5.x while its own
      # package.json declares the new major — Next then decides TypeScript is
      # missing and tries to reinstall it via pnpm, which 404s on the
      # workspace-only @sotto/* packages and kills `next build`. Drop this
      # entry once typescript-eslint ships TS 7 support; nothing in our own
      # code blocks the upgrade (lint, type-check, and tests all pass on 7).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Minor + patch bumps are batched into one low-risk PR that should stay
      # green and be safe to merge on sight. Major bumps are deliberately left
      # OUT of every group so Dependabot opens them as individual PRs — majors
      # routinely need code migration and must be reviewed in isolation, never
      # bundled (a single broken lockfile entry blocks the whole batch).
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - '*'
  # Container base images (Dockerfiles live at the repo root).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
