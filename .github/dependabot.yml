version: 2
updates:
  # JavaScript / TypeScript (npm workspaces — the root lockfile covers
  # apps/web, packages/*, and services/*).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply-chain guard: never open a PR for a release younger than 7 days,
    # so a freshly compromised version is not pulled in immediately.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # TypeScript majors cannot land while typescript-eslint pins
      # `typescript >=4.8.4 <6.1.0` as a peer. npm satisfies that peer by
      # hoisting TS 5.x to the root, so apps/web resolves 5.x while its own
      # package.json declares the new major — Next then decides TypeScript is
      # missing and tries to reinstall it via pnpm, which 404s on the
      # workspace-only @sotto/* packages and kills `next build`. Drop this
      # entry once typescript-eslint ships TS 7 support; nothing in our own
      # code blocks the upgrade (lint, type-check, and tests all pass on 7).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # One PR for every npm bump. No `update-types` filter: omitting it
      # groups every kind of update, majors included. Listing them explicitly
      # looks equivalent but is not — an update Dependabot does not classify
      # as major/minor/patch (a digest or SHA-pin bump) falls outside a
      # filtered group and gets its own PR. The previous arrangement kept
      # majors out so each could be migrated in isolation; that tradeoff is
      # given up deliberately for one PR a week. When a major does block the
      # batch, split just that dependency out with `exclude-patterns` rather
      # than ungrouping everything again.
      npm-all:
        patterns:
          - '*'
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - '*'
  # Container base images (Dockerfiles live at the repo root).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Grouped for the same reason as npm: one PR per ecosystem per week.
    # Unfiltered on purpose — base-image bumps are usually digest updates,
    # which an `update-types` filter would push out into their own PRs.
    groups:
      docker:
        patterns:
          - '*'
