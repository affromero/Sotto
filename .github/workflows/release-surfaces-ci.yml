name: Release surfaces

# Select each native surface separately. Manual runs validate all surfaces.
on:
  workflow_dispatch:
  pull_request:
    # Duplicated rather than shared via a YAML anchor: GitHub Actions does not
    # expand anchors, so both lists have to be spelled out.
    paths:
      - 'apps/desktop/**'
      - 'apps/ios/**'
      - 'apps/android/**'
      - 'e2e/android/**'
      - 'e2e/native/**'
      - 'e2e/run.mjs'
      - 'e2e/provider.mjs'
      - 'packages/shared/fixtures/play/**'
      - 'packages/shared/src/play/**'
      - 'packages/shared/src/contracts/play.ts'
      - 'scripts/play/**'
      - 'apps/web/src/lib/play/**'
      - '.github/workflows/release-surfaces-ci.yml'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/ci/test-desktop-appimage.sh'
      - 'scripts/ci/native-scope.mjs'
      - 'scripts/ci/android-results.py'
      - 'apps/web/public/brand/sotto-mark.svg'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/ios/**'
      - 'apps/android/**'
      - 'e2e/android/**'
      - 'e2e/native/**'
      - 'e2e/run.mjs'
      - 'e2e/provider.mjs'
      - 'packages/shared/fixtures/play/**'
      - 'packages/shared/src/play/**'
      - 'packages/shared/src/contracts/play.ts'
      - 'scripts/play/**'
      - 'apps/web/src/lib/play/**'
      - '.github/workflows/release-surfaces-ci.yml'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/ci/test-desktop-appimage.sh'
      - 'scripts/ci/native-scope.mjs'
      - 'scripts/ci/android-results.py'
      - 'apps/web/public/brand/sotto-mark.svg'

concurrency:
  group: release-surfaces-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      ios: ${{ steps.scope.outputs.ios }}
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Select changed native surfaces
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            node scripts/ci/native-scope.mjs --all >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/native-scope.mjs --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: npm ci
        working-directory: apps/desktop
      # Icons are gitignored (generated from the orb SVG); tauri::generate_context!
      # fails without them.
      - run: npm run icon
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  desktop-linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools xvfb dbus-x11 xdotool
      - name: Build and test Linux package
        working-directory: apps/desktop
        run: |
          npm ci
          npm run icon
          npm test
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --test glib_variant
          npm run build -- --bundles appimage
      - name: Launch AppImage
        run: |
          for image in apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage; do
            bash scripts/ci/test-desktop-appimage.sh "$image"
          done

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate Android and build unsigned distributions
        run: ./apps/android/gradlew -p apps/android --no-daemon lint testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease
      - name: Preserve Android artifacts and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/apk/
            apps/android/app/build/outputs/bundle/
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  android-device:
    needs: [changes, android]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '36'
            profile: pixel_9
          - api: '37.0'
            profile: pixel_tablet
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
      - name: Select pinned Android tools for emulator creation
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile
          from pathlib import Path
          tools = Path(os.environ['ANDROID_HOME']) / 'cmdline-tools'
          pinned = tools / '16111833'
          latest = tools / 'latest'
          manager = pinned / 'bin/avdmanager'
          inventory = subprocess.check_output([str(manager), 'list', 'device', '-c'], text=True)
          if os.environ['SOTTO_ANDROID_DEVICE_PROFILE'] not in inventory.splitlines():
              raise SystemExit('Requested device is absent from pinned Android tools')
          if latest.exists() or latest.is_symlink():
              backup = Path(tempfile.mkdtemp(prefix='sotto-preinstalled-tools-', dir=os.environ['RUNNER_TEMP']))
              latest.rename(backup / 'latest')
          latest.symlink_to(pinned, target_is_directory=True)
          print('Emulator tools:', latest.resolve(strict=True))
          print(inventory)
          PY
        env:
          SOTTO_ANDROID_DEVICE_PROFILE: ${{ matrix.profile }}
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run native Android behavior and process recovery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          SOTTO_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/android-process
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-port: 5554
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back emulated -wipe-data
          script: |
            ./apps/android/gradlew -p apps/android --no-daemon connectedDebugAndroidTest
            python3 scripts/ci/android-results.py apps/android/app/build/outputs/androidTest-results/connected
            node e2e/android/process.mjs "$ANDROID_SERIAL"
      - name: Preserve native Android diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-device-${{ matrix.api }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/androidTest-results/
            apps/android/app/build/reports/androidTests/
            ${{ runner.temp }}/android-process/
          retention-days: 7
          if-no-files-found: warn

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Select available iPhone and iPad simulators
        run: |
          xcrun simctl list runtimes
          python3 - <<'PY'
          import json, os, subprocess
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', '--json']))
          runtimes = sorted(
              (runtime for runtime in inventory['runtimes']
               if runtime['isAvailable'] and runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')),
              key=lambda runtime: tuple(map(int, runtime['version'].split('.'))), reverse=True)
          for runtime in runtimes:
              devices = {device['name']: device['udid']
                         for device in inventory['devices'].get(runtime['identifier'], [])
                         if device['isAvailable']}
              if 'iPhone 17' not in devices or 'iPad Pro 13-inch (M5)' not in devices:
                  continue
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f"SOTTO_IPHONE_SIMULATOR={devices['iPhone 17']}\n")
                  output.write(f"SOTTO_IPAD_SIMULATOR={devices['iPad Pro 13-inch (M5)']}\n")
              print(f"Testing iPhone 17 and iPad Pro 13-inch (M5) on {runtime['name']}")
              break
          else:
              raise SystemExit('No available iOS runtime contains both required simulator devices')
          PY
      # The app is universal, so it is compiled and tested on both device
      # families: the layout, and the workbook in particular, take different
      # paths per size class.
      - name: Run app tests on iPhone and iPad
        run: >-
          xcodebuild test
          -project apps/ios/Sotto.xcodeproj
          -scheme Sotto
          -destination "platform=iOS Simulator,id=$SOTTO_IPHONE_SIMULATOR"
          -destination "platform=iOS Simulator,id=$SOTTO_IPAD_SIMULATOR"
          -resultBundlePath "$RUNNER_TEMP/sotto-ios-results.xcresult"
          CODE_SIGN_IDENTITY=-
      - name: Preserve failed iOS test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sotto-ios-results.xcresult
          retention-days: 7
          if-no-files-found: warn
