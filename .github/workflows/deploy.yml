name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Stop docker/build-push-action uploading a *.dockerbuild record as an artifact on every run.
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  ci:
    if: github.repository == 'affromero/Sotto'
    name: CI Checks
    outputs:
      base_digest: ${{ steps.worker_base.outputs.digest }}
      publish: ${{ steps.production_image_env.outputs.publish }}
    runs-on: ubuntu-latest
    # `next build` statically generates /_not-found, which resolves absolute
    # Sotto URLs at build time and throws without this. ci.yml sets the same.
    env:
      NEXT_PUBLIC_APP_URL: https://selfhost.example.com
      SIDEDOOR_TEST_DATABASE_URL: postgresql://postgres:sidedoor-test-only@127.0.0.1:5432/sidedoor_test
      SIDEDOOR_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sidedoor-test-only
          POSTGRES_DB: sidedoor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sidedoor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - run: npx --no-install prisma generate --schema=apps/web/prisma/schema.prisma
      - run: npm run ci

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build worker base candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers-base
          load: true
          tags: |
            ghcr.io/affromero/sotto-workers-base:${{ github.sha }}
            ghcr.io/affromero/sotto-workers-base:node22
          cache-from: type=gha,scope=sotto-workers-base
          cache-to: type=gha,mode=max,scope=sotto-workers-base

      - name: Verify and publish worker base
        id: worker_base
        run: |
          set -euo pipefail
          base="ghcr.io/affromero/sotto-workers-base:${{ github.sha }}"
          bash scripts/deploy/smoke-worker-base.sh "$base"
          docker push "$base"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base")
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
          docker push ghcr.io/affromero/sotto-workers-base:node22

      - name: Validate production image env
        id: production_image_env
        run: |
          set -euo pipefail
          if [ -z "$SOTTO_PUBLIC_APP_URL" ] || [ -z "$SOTTO_PERSONAL_APP_URL" ]; then
            echo "SOTTO_PUBLIC_APP_URL and SOTTO_PERSONAL_APP_URL repository variables are required; skipping production image publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
        env:
          SOTTO_PUBLIC_APP_URL: ${{ vars.SOTTO_PUBLIC_APP_URL }}
          SOTTO_PERSONAL_APP_URL: ${{ vars.SOTTO_PERSONAL_APP_URL }}

      - name: Build showcase web candidate
        if: steps.production_image_env.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            RUNTIME_UID=1000
            NEXT_PUBLIC_APP_URL=${{ vars.SOTTO_PUBLIC_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          tags: |
            ghcr.io/affromero/sotto-web-prod:${{ github.sha }}
          cache-from: type=gha,scope=sotto-web-prod
          cache-to: type=gha,mode=max,scope=sotto-web-prod

      - name: Verify and publish showcase web
        if: steps.production_image_env.outputs.publish == 'true'
        run: |
          bash scripts/deploy/smoke-web-image.sh ghcr.io/affromero/sotto-web-prod:${{ github.sha }} 1000
          docker push ghcr.io/affromero/sotto-web-prod:${{ github.sha }}

      - name: Build personal web candidate
        if: steps.production_image_env.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            RUNTIME_UID=1000
            NEXT_PUBLIC_APP_URL=${{ vars.SOTTO_PERSONAL_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          tags: |
            ghcr.io/affromero/sotto-web-personal-prod:${{ github.sha }}
          cache-from: type=gha,scope=sotto-web-personal-prod
          cache-to: type=gha,mode=max,scope=sotto-web-personal-prod

      - name: Verify and publish personal web
        if: steps.production_image_env.outputs.publish == 'true'
        run: |
          bash scripts/deploy/smoke-web-image.sh ghcr.io/affromero/sotto-web-personal-prod:${{ github.sha }} 1000
          docker push ghcr.io/affromero/sotto-web-personal-prod:${{ github.sha }}

  workers:
    needs: ci
    if: needs.ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production worker candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers
          load: true
          build-args: |
            WORKER_BASE_IMAGE=ghcr.io/affromero/sotto-workers-base@${{ needs.ci.outputs.base_digest }}
            COMMIT_SHA=${{ github.sha }}
            RUNTIME_UID=1000
          tags: ghcr.io/affromero/sotto-workers-prod:${{ github.sha }}
          cache-from: type=gha,scope=sotto-workers-prod
          cache-to: type=gha,mode=max,scope=sotto-workers-prod
      - name: Verify worker runtime before publication
        run: bash scripts/deploy/smoke-worker-image.sh ghcr.io/affromero/sotto-workers-prod:${{ github.sha }} 1000
      - name: Publish verified worker
        run: docker push ghcr.io/affromero/sotto-workers-prod:${{ github.sha }}
