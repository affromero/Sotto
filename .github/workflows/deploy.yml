name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      - run: git config --global url."git@github.com:".insteadOf "https://github.com/" && git submodule update --init --recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/web/prisma/schema.prisma
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  publish-remotion:
    name: Publish Remotion Image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      - run: git config --global url."git@github.com:".insteadOf "https://github.com/" && git submodule update --init --recursive

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/remotion/Dockerfile
          push: true
          tags: |
            ghcr.io/affromero/sotto-remotion:latest
            ghcr.io/affromero/sotto-remotion:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=remotion
          cache-to: type=gha,mode=max,scope=remotion
