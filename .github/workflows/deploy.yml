name: Production images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      review_only:
        description: Build only the isolated App Review web image
        type: boolean
        default: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.review_only && 'review-images' || 'production-images' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.repository == 'affromero/Sotto' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.validation.outputs.runtime }}
      sha: ${{ steps.validation.outputs.sha }}
      publish: ${{ steps.validation.outputs.publish }}
      review: ${{ steps.validation.outputs.review }}
      source-run-id: ${{ steps.gate.outputs.run_id }}
    steps:
      - name: Find successful source validation for this exact main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          if [ -n "$SOURCE_RUN_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > delivery/source-run.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$RELEASE_SHA&status=success&per_page=100" > delivery/source-runs.json
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          single = Path('delivery/source-run.json')
          runs = [json.loads(single.read_text())] if single.exists() else json.loads(
              Path('delivery/source-runs.json').read_text())['workflow_runs']
          valid = [run for run in runs if (
              run.get('head_sha') == os.environ['RELEASE_SHA'] and
              run.get('head_branch') == 'main' and
              run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY'] and
              run.get('conclusion') == 'success' and
              run.get('status') == 'completed' and
              run.get('path') == '.github/workflows/ci.yml'
          )]
          if not valid:
              raise SystemExit('No successful production source gate exists for this exact main commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={valid[0]['id']}\n")
          PY
      - name: Download source validation from the verified run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gate.outputs.run_id }}
          name: source-validation-${{ env.RELEASE_SHA }}
          path: delivery/verified
      - name: Validate release revision and runtime scope
        id: validation
        env:
          SOTTO_PUBLIC_APP_URL: ${{ vars.SOTTO_PUBLIC_APP_URL }}
          SOTTO_PERSONAL_APP_URL: ${{ vars.SOTTO_PERSONAL_APP_URL }}
          REVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.review_only && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          record = json.loads(Path('delivery/verified/source-validation.json').read_text())
          if (
              record.get('sha') != os.environ['RELEASE_SHA'] or
              type(record.get('runtime_changed')) is not bool or
              type(record.get('source_validated')) is not bool or
              (record['runtime_changed'] and not record['source_validated'])
          ):
              raise SystemExit('Source validation artifact does not match this release')
          manual = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          if manual and not record['source_validated']:
              raise SystemExit('Dispatch ci.yml on main to validate this commit before rebuilding images')
          runtime = manual or record['runtime_changed']
          review = manual and os.environ.get('REVIEW_ONLY') == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"runtime={str(runtime).lower()}\n")
              output.write(f"sha={record['sha']}\n")
              publish = not review and bool(os.environ['SOTTO_PUBLIC_APP_URL'] and os.environ['SOTTO_PERSONAL_APP_URL'])
              output.write(f"publish={str(publish).lower()}\n")
              output.write(f"review={str(review).lower()}\n")
          PY

  worker-base:
    needs: ci
    if: needs.ci.outputs.runtime == 'true' && needs.ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read locked Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node scripts/deploy/images/playwright-version.cjs)" >> "$GITHUB_ENV"
      - name: Build worker base candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile.workers-base
          load: true
          build-args: PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
          tags: |
            ghcr.io/affromero/sotto-workers-base:${{ env.RELEASE_SHA }}
            ghcr.io/affromero/sotto-workers-base:node24
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-workers-base:buildcache-prod-amd64
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-workers-base:buildcache-prod-amd64,mode=max,ignore-error=true
      - name: Verify and publish worker base
        id: publish
        run: |
          set -euo pipefail
          base="ghcr.io/affromero/sotto-workers-base:$RELEASE_SHA"
          bash scripts/deploy/smoke-worker-base.sh "$base"
          docker push "$base"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base")
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
          docker push ghcr.io/affromero/sotto-workers-base:node24

  showcase:
    needs: ci
    if: needs.ci.outputs.runtime == 'true' && needs.ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
      metadata-id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - name: Use a disposable containerd image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.2.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build showcase web candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          build-args: |
            COMMIT_SHA=${{ env.RELEASE_SHA }}
            RUNTIME_UID=1000
            NEXT_PUBLIC_APP_URL=${{ vars.SOTTO_PUBLIC_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          tags: ghcr.io/affromero/sotto-web-prod:${{ env.RELEASE_SHA }}
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-web-prod:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-web-prod:buildcache-amd64,mode=max,ignore-error=true
      - name: Verify and publish showcase web
        id: publish
        run: |
          set -euo pipefail
          image="ghcr.io/affromero/sotto-web-prod:$RELEASE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RELEASE_SHA"
          bash scripts/deploy/smoke-web-image.sh "$image" 1000
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          python3 -m scripts.deploy.images.collect --role showcase --release-sha "$RELEASE_SHA" --reference "$reference" --output delivery/showcase.json
        env:
          SOURCE_RUN_ID: ${{ needs.ci.outputs.source-run-id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: metadata
        with:
          name: production-image-metadata-${{ env.RELEASE_SHA }}-showcase-${{ github.run_attempt }}
          path: delivery/showcase.json
          if-no-files-found: error
          retention-days: 14

  personal:
    needs: ci
    if: needs.ci.outputs.runtime == 'true' && needs.ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
      metadata-id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - name: Use a disposable containerd image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.2.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build personal web candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          build-args: |
            COMMIT_SHA=${{ env.RELEASE_SHA }}
            RUNTIME_UID=1000
            NEXT_PUBLIC_APP_URL=${{ vars.SOTTO_PERSONAL_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          tags: ghcr.io/affromero/sotto-web-personal-prod:${{ env.RELEASE_SHA }}
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-web-personal-prod:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-web-personal-prod:buildcache-amd64,mode=max,ignore-error=true
      - name: Verify and publish personal web
        id: publish
        run: |
          set -euo pipefail
          image="ghcr.io/affromero/sotto-web-personal-prod:$RELEASE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RELEASE_SHA"
          bash scripts/deploy/smoke-web-image.sh "$image" 1000
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          python3 -m scripts.deploy.images.collect --role personal --release-sha "$RELEASE_SHA" --reference "$reference" --output delivery/personal.json
        env:
          SOURCE_RUN_ID: ${{ needs.ci.outputs.source-run-id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: metadata
        with:
          name: production-image-metadata-${{ env.RELEASE_SHA }}-personal-${{ github.run_attempt }}
          path: delivery/personal.json
          if-no-files-found: error
          retention-days: 14

  workers:
    needs: [ci, worker-base]
    if: needs.ci.outputs.runtime == 'true' && needs.ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
      metadata-id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - name: Use a disposable containerd image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.2.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production worker candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile.workers
          load: true
          build-args: |
            WORKER_BASE_IMAGE=ghcr.io/affromero/sotto-workers-base@${{ needs.worker-base.outputs.digest }}
            COMMIT_SHA=${{ env.RELEASE_SHA }}
            RUNTIME_UID=1000
          tags: ghcr.io/affromero/sotto-workers-prod:${{ env.RELEASE_SHA }}
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-workers-prod:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-workers-prod:buildcache-amd64,mode=max,ignore-error=true
      - name: Verify and publish production worker
        id: publish
        run: |
          set -euo pipefail
          image="ghcr.io/affromero/sotto-workers-prod:$RELEASE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RELEASE_SHA"
          bash scripts/deploy/smoke-worker-image.sh "$image" 1000
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          python3 -m scripts.deploy.images.collect --role workers --release-sha "$RELEASE_SHA" --reference "$reference" --output delivery/workers.json
        env:
          SOURCE_RUN_ID: ${{ needs.ci.outputs.source-run-id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: metadata
        with:
          name: production-image-metadata-${{ env.RELEASE_SHA }}-workers-${{ github.run_attempt }}
          path: delivery/workers.json
          if-no-files-found: error
          retention-days: 14

  release-record:
    needs: [ci, showcase, personal, workers]
    if: needs.ci.outputs.runtime == 'true' && needs.ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Validate exact image metadata artifact IDs
        id: receipts
        env:
          SHOWCASE_METADATA_ID: ${{ needs.showcase.outputs.metadata-id }}
          PERSONAL_METADATA_ID: ${{ needs.personal.outputs.metadata-id }}
          WORKERS_METADATA_ID: ${{ needs.workers.outputs.metadata-id }}
        run: |
          python3 - <<'PY'
          import os
          import re

          ids = [os.environ[f'{role}_METADATA_ID'] for role in ('SHOWCASE', 'PERSONAL', 'WORKERS')]
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in ids) or len(set(ids)) != 3:
              raise SystemExit('Exactly three distinct image metadata artifact IDs are required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ids={','.join(ids)}\n")
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.receipts.outputs.ids }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: delivery/image-metadata
          merge-multiple: true
      - name: Record verified production image digests
        env:
          SHOWCASE_IMAGE: ${{ needs.showcase.outputs.image }}
          PERSONAL_IMAGE: ${{ needs.personal.outputs.image }}
          WORKERS_IMAGE: ${{ needs.workers.outputs.image }}
        run: |
          mkdir -p delivery
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          images = {role: os.environ[f'{role.upper()}_IMAGE'] for role in ('showcase', 'personal', 'workers')}
          repositories = {
              'showcase': 'sotto-web-prod',
              'personal': 'sotto-web-personal-prod',
              'workers': 'sotto-workers-prod',
          }
          for role, image in images.items():
              expected = rf'ghcr.io/affromero/{repositories[role]}@sha256:[0-9a-f]{{64}}'
              if not re.fullmatch(expected, image):
                  raise SystemExit(f'Invalid immutable image reference: {image}')
          Path('delivery/production-release.json').write_text(json.dumps({
              'sha': os.environ['RELEASE_SHA'],
              'images': images,
          }, indent=2) + '\n')
          PY
      - name: Assemble verified image measurements and runtime evidence
        env:
          SOURCE_RUN_ID: ${{ needs.ci.outputs.source-run-id }}
        run: |
          python3 -m scripts.deploy.images.metadata \
            --release delivery/production-release.json \
            --receipts delivery/image-metadata \
            --output delivery/production-release-metadata.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-run-id "$SOURCE_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-release-${{ env.RELEASE_SHA }}
          overwrite: true
          path: |
            delivery/production-release.json
            delivery/production-release-metadata.json
          if-no-files-found: error
          retention-days: 14

  review:
    needs: ci
    if: needs.ci.outputs.review == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - name: Use a disposable containerd image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.2.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build isolated review web candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            COMMIT_SHA=${{ env.RELEASE_SHA }}
            RUNTIME_UID=1000
            NEXT_PUBLIC_APP_URL=https://demo.sotto.fm
          labels: io.sotto.public-origin=https://demo.sotto.fm
          tags: ghcr.io/affromero/sotto-review-web:${{ env.RELEASE_SHA }}
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-review-web:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-review-web:buildcache-amd64,mode=max,ignore-error=true
      - name: Verify and publish isolated review web
        env:
          SOURCE_RUN_ID: ${{ needs.ci.outputs.source-run-id }}
        run: |
          set -euo pipefail
          image="ghcr.io/affromero/sotto-review-web:$RELEASE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RELEASE_SHA"
          bash scripts/deploy/smoke-web-image.sh "$image" 1000
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          python3 -m scripts.deploy.review.artifact collect \
            --release-sha "$RELEASE_SHA" --reference "$reference" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-run-id "$SOURCE_RUN_ID" --receipt delivery/review-release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: review-release-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: delivery/review-release.json
          if-no-files-found: error
          retention-days: 14

  local-stt:
    needs: ci
    if: needs.ci.outputs.runtime == 'true' && needs.ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install audio decoder
        run: |
          sudo test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build local transcription candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: services/local-stt
          platforms: linux/amd64
          load: true
          build-args: COMMIT_SHA=${{ env.RELEASE_SHA }}
          tags: ghcr.io/affromero/sotto-local-stt-prod:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=sotto-local-stt
          cache-to: type=gha,mode=max,scope=sotto-local-stt
      - name: Verify offline German recordings
        run: |
          bash scripts/deploy/smoke-local-stt-image.sh \
            ghcr.io/affromero/sotto-local-stt-prod:${{ env.RELEASE_SHA }} \
            '${{ env.RELEASE_SHA }}' \
            '${{ runner.temp }}/local-stt-evidence-${{ env.RELEASE_SHA }}'
      - name: Retain public speech qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-stt-evidence-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/local-stt-evidence-${{ env.RELEASE_SHA }}
          if-no-files-found: warn
          retention-days: 7
      - name: Publish verified local transcription image
        run: docker push ghcr.io/affromero/sotto-local-stt-prod:${{ env.RELEASE_SHA }}
