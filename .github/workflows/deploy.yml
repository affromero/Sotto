name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Stop docker/build-push-action uploading a *.dockerbuild record as an artifact on every run.
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  ci:
    if: github.repository == 'affromero/Sotto'
    name: CI Checks
    runs-on: ubuntu-latest
    # `next build` statically generates /_not-found, which resolves absolute
    # Sotto URLs at build time and throws without this. ci.yml sets the same.
    env:
      NEXT_PUBLIC_APP_URL: https://selfhost.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/web/prisma/schema.prisma
      - run: npm run ci

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to rebuild worker base
        id: worker_base
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          build_base=false
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            build_base=true
          elif ! git diff --quiet "$before" "$GITHUB_SHA" -- apps/web/Dockerfile.workers-base; then
            build_base=true
          elif ! docker manifest inspect ghcr.io/affromero/sotto-workers-base:node22 >/dev/null 2>&1; then
            build_base=true
          fi
          echo "build=$build_base" >> "$GITHUB_OUTPUT"

      - name: Build and push worker base
        if: steps.worker_base.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers-base
          push: true
          tags: |
            ghcr.io/affromero/sotto-workers-base:node22
            ghcr.io/affromero/sotto-workers-base:${{ github.sha }}
          cache-from: type=gha,scope=sotto-workers-base
          cache-to: type=gha,mode=max,scope=sotto-workers-base

      - name: Validate production image env
        id: production_image_env
        run: |
          set -euo pipefail
          if [ -z "$SOTTO_PUBLIC_APP_URL" ] || [ -z "$SOTTO_PERSONAL_APP_URL" ]; then
            echo "SOTTO_PUBLIC_APP_URL and SOTTO_PERSONAL_APP_URL repository variables are required; skipping production image publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
        env:
          SOTTO_PUBLIC_APP_URL: ${{ vars.SOTTO_PUBLIC_APP_URL }}
          SOTTO_PERSONAL_APP_URL: ${{ vars.SOTTO_PERSONAL_APP_URL }}

      - name: Build and push showcase web image
        if: steps.production_image_env.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=${{ vars.SOTTO_PUBLIC_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          tags: |
            ghcr.io/affromero/sotto-web-prod:${{ github.sha }}
          cache-from: type=gha,scope=sotto-web-prod
          cache-to: type=gha,mode=max,scope=sotto-web-prod

      - name: Build and push personal web image
        if: steps.production_image_env.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=${{ vars.SOTTO_PERSONAL_APP_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          tags: |
            ghcr.io/affromero/sotto-web-personal-prod:${{ github.sha }}
          cache-from: type=gha,scope=sotto-web-personal-prod
          cache-to: type=gha,mode=max,scope=sotto-web-personal-prod

      - name: Reclaim runner disk before worker image
        if: steps.production_image_env.outputs.publish == 'true'
        run: |
          docker buildx prune --all --force
          docker system prune --all --force
          df -h /

      - name: Build and push production worker image
        if: steps.production_image_env.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers
          push: true
          build-args: |
            WORKER_BASE_IMAGE=ghcr.io/affromero/sotto-workers-base:node22
          tags: |
            ghcr.io/affromero/sotto-workers-prod:${{ github.sha }}
          cache-from: type=gha,scope=sotto-workers-prod
          cache-to: type=gha,mode=max,scope=sotto-workers-prod
