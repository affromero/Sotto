name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    # `next build` statically generates /_not-found, which resolves absolute
    # Sotto URLs at build time and throws without this. ci.yml sets the same.
    env:
      NEXT_PUBLIC_APP_URL: https://selfhost.example.com
    steps:
      - uses: actions/checkout@v6
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      - run: git config --global url."git@github.com:".insteadOf "https://github.com/" && git submodule update --init --recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/web/prisma/schema.prisma
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

