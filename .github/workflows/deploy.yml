name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Production
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if pitch rebuild needed
        id: pitch_check
        run: |
          PITCH_PATHS="docs/ scripts/rebuild-pitch.sh scripts/capture-pitch-screenshots.ts prisma/seed-demo.ts .claude/skills/update-pitch/"
          if git diff --quiet HEAD~1 HEAD -- $PITCH_PATHS 2>/dev/null; then
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "No pitch-related files changed"
          else
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Pitch-related files changed — will rebuild after deploy"
          fi

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: sotto
          key: ${{ secrets.SSH_KEY }}
          envs: REPO_TOKEN
          script: |
            set -e
            cd ~/sotto

            echo "Pulling latest code..."
            git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/affromero/Sotto.git"
            git pull origin main

            echo "Building containers..."
            docker compose -f docker-compose.prod.yml build

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml --profile migration run --rm migrate npx prisma db push

            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for health check..."
            sleep 30
            curl -sf http://localhost:3000/api/health
            echo "Health check passed"

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deploy complete!"
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild pitch deck
        id: pitch
        if: steps.deploy.outcome == 'success' && steps.pitch_check.outputs.rebuild == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: sotto
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN
          script: |
            cd ~/sotto
            GITHUB_TOKEN="$GITHUB_TOKEN" bash scripts/rebuild-pitch.sh
        env:
          GITHUB_TOKEN: ${{ secrets.AI_SKILLS_TOKEN }}

      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome || job.status }}
          PITCH_STATUS: ${{ steps.pitch.outcome }}
        run: |
          COMMIT_MSG=$(git log -1 --format='%s')
          COMMIT_SHA=$(git log -1 --format='%h')
          AUTHOR=$(git log -1 --format='%an')

          if [ "$DEPLOY_STATUS" = "success" ] || [ "$DEPLOY_STATUS" = "" ]; then
            EMOJI="✅"
            STATUS="deployed"
          else
            EMOJI="❌"
            STATUS="failed"
          fi

          if [ "$PITCH_STATUS" = "success" ]; then
            PITCH_LINE="Pitch: ✅ rebuilt"
          elif [ "$PITCH_STATUS" = "skipped" ] || [ -z "$PITCH_STATUS" ]; then
            PITCH_LINE="Pitch: ⏭ skipped"
          else
            PITCH_LINE="Pitch: ❌ failed"
          fi

          # Build failure detail
          FAIL_LINE=""
          if [ "$DEPLOY_STATUS" = "failure" ]; then
            FAIL_LINE="Reason: deploy SSH failed — check run logs"
          elif [ "$PITCH_STATUS" = "failure" ]; then
            FAIL_LINE="Reason: pitch rebuild failed — check run logs"
          fi

          TEXT="${EMOJI} <b>sotto.fm ${STATUS}</b>
          Commit: <code>${COMMIT_SHA}</code> ${COMMIT_MSG}
          By: ${AUTHOR}
          ${PITCH_LINE}
          ${FAIL_LINE}

          <a href=\"https://sotto.fm/romero\">sotto.fm</a> · <a href=\"https://sotto.fm/pitch\">Pitch</a> · <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Run</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
