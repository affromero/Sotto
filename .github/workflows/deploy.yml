name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=apps/web/prisma/schema.prisma
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Production
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy_status: ${{ steps.deploy.outcome }}
      pitch_status: ${{ steps.pitch.outcome }}
      pitch_changed: ${{ steps.pitch_check.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if pitch rebuild needed
        id: pitch_check
        run: |
          PITCH_PATHS="docs/ scripts/rebuild-pitch.sh scripts/capture-pitch-screenshots.ts apps/web/prisma/seed-demo.ts .claude/skills/update-pitch/"
          if git diff --quiet HEAD~1 HEAD -- $PITCH_PATHS 2>/dev/null; then
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "No pitch-related files changed"
          else
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Pitch-related files changed — will rebuild after deploy"
          fi

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: sotto
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/sotto

            echo "Pulling latest code..."
            git pull origin main

            echo "Downloading secrets from Doppler..."
            doppler secrets download --no-file --format env > .env
            chmod 600 .env

            echo "Building containers..."
            export COMMIT_SHA=$(git rev-parse --short HEAD)
            docker compose -f docker-compose.prod.yml build

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml --profile migration run --build --rm migrate npx prisma db push --schema=prisma/schema.prisma

            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              sleep 10
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "Health check passed (attempt $i)"
                break
              fi
              echo "Attempt $i/12 — not ready yet"
              if [ "$i" -eq 12 ]; then
                echo "Health check failed after 120s"
                docker compose -f docker-compose.prod.yml logs --tail=50 web
                exit 1
              fi
            done

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deploy complete!"

      - name: Rebuild pitch deck
        id: pitch
        if: steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: sotto
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          envs: GITHUB_TOKEN,PITCH_FILES_CHANGED
          script: |
            cd ~/sotto
            if [ "$PITCH_FILES_CHANGED" = "true" ] || [ ! -f .pitch/manifest.json ]; then
              GITHUB_TOKEN="$GITHUB_TOKEN" bash scripts/rebuild-pitch.sh
            else
              echo "Pitch build exists and no files changed — skipping"
            fi
        env:
          GITHUB_TOKEN: ${{ secrets.AI_SKILLS_TOKEN }}
          PITCH_FILES_CHANGED: ${{ steps.pitch_check.outputs.rebuild }}

  notify:
    name: Telegram Notification
    needs: [ci, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Notify via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_STATUS: ${{ needs.ci.result }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.deploy_status || needs.deploy.result }}
          PITCH_STATUS: ${{ needs.deploy.outputs.pitch_status }}
          PITCH_FILES_CHANGED: ${{ needs.deploy.outputs.pitch_changed }}
        run: |
          COMMIT_MSG=$(git log -1 --format='%s')
          COMMIT_SHA=$(git log -1 --format='%h')
          PREV_SHA=$(git log -1 --format='%h' HEAD~1)
          AUTHOR=$(git log -1 --format='%an')

          # Determine overall status
          if [ "$CI_STATUS" != "success" ]; then
            EMOJI="❌"
            STATUS="CI failed"
          elif [ "$DEPLOY_STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS="deployed"
          else
            EMOJI="❌"
            STATUS="deploy failed"
          fi

          if [ "$PITCH_STATUS" = "success" ] && [ "$PITCH_FILES_CHANGED" = "true" ]; then
            PITCH_LINE="Pitch: ✅ rebuilt"
          elif [ "$PITCH_STATUS" = "success" ]; then
            PITCH_LINE="Pitch: ✅ up to date"
          elif [ "$PITCH_STATUS" = "skipped" ] || [ -z "$PITCH_STATUS" ]; then
            PITCH_LINE="Pitch: ⏭ skipped"
          else
            PITCH_LINE="Pitch: ❌ failed"
          fi

          # Build failure detail
          FAIL_LINE=""
          if [ "$CI_STATUS" != "success" ]; then
            FAIL_LINE="Reason: CI checks failed — lint, types, tests, or build"
          elif [ "$DEPLOY_STATUS" = "failure" ]; then
            FAIL_LINE="Reason: deploy SSH failed — check run logs"
          elif [ "$PITCH_STATUS" = "failure" ]; then
            FAIL_LINE="Reason: pitch rebuild failed — check run logs"
          fi

          # Verify live version via health check
          HEALTH_LINE=""
          if [ "$DEPLOY_STATUS" = "success" ]; then
            HEALTH=$(curl -sf --max-time 5 "https://sotto.fm/api/health" 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              LIVE_VERSION=$(echo "$HEALTH" | jq -r '.version // "unknown"')
              LIVE_STATUS=$(echo "$HEALTH" | jq -r '.status // "unknown"')
              if [ "$LIVE_VERSION" = "$COMMIT_SHA" ]; then
                HEALTH_LINE="Health: ✅ ${LIVE_STATUS} (${LIVE_VERSION})"
              else
                HEALTH_LINE="Health: ⚠️ ${LIVE_STATUS} (${LIVE_VERSION} — expected ${COMMIT_SHA})"
              fi

              # Build per-service check lines
              CHECKS_LINE=""
              for svc in database redis storage claudeCode anthropic elevenlabs stripe; do
                SVC_STATUS=$(echo "$HEALTH" | jq -r ".checks.${svc}.status // empty")
                SVC_MS=$(echo "$HEALTH" | jq -r ".checks.${svc}.latencyMs // empty")
                SVC_DETAIL=$(echo "$HEALTH" | jq -r ".checks.${svc}.detail // empty")
                if [ -n "$SVC_STATUS" ]; then
                  if [ "$SVC_STATUS" = "ok" ]; then
                    MS_TEXT=""
                    [ -n "$SVC_MS" ] && [ "$SVC_MS" != "0" ] && MS_TEXT=" ${SVC_MS}ms"
                    CHECKS_LINE="${CHECKS_LINE}  ${svc}: ✅${MS_TEXT}"$'\n'
                  elif [ "$SVC_STATUS" = "not_configured" ] || [ "$SVC_STATUS" = "not_installed" ]; then
                    CHECKS_LINE="${CHECKS_LINE}  ${svc}: ⏭ ${SVC_STATUS}"$'\n'
                  elif [ "$SVC_STATUS" = "degraded" ]; then
                    CHECKS_LINE="${CHECKS_LINE}  ${svc}: ⚠️ degraded"$'\n'
                  else
                    DETAIL_TEXT=""
                    [ -n "$SVC_DETAIL" ] && DETAIL_TEXT=" (${SVC_DETAIL})"
                    CHECKS_LINE="${CHECKS_LINE}  ${svc}: ❌ ${SVC_STATUS}${DETAIL_TEXT}"$'\n'
                  fi
                fi
              done

              # OAuth providers
              OAUTH_PROVIDERS=""
              for provider in google github twitter apple; do
                ENABLED=$(echo "$HEALTH" | jq -r ".oauth.${provider} // false")
                if [ "$ENABLED" = "true" ]; then
                  OAUTH_PROVIDERS="${OAUTH_PROVIDERS} ${provider}"
                fi
              done
              if [ -n "$OAUTH_PROVIDERS" ]; then
                CHECKS_LINE="${CHECKS_LINE}  oauth: ✅${OAUTH_PROVIDERS}"$'\n'
              else
                CHECKS_LINE="${CHECKS_LINE}  oauth: ⚠️ none"$'\n'
              fi

              # VAPID / Web Push
              VAPID=$(echo "$HEALTH" | jq -r ".vapid // false")
              if [ "$VAPID" = "true" ]; then
                CHECKS_LINE="${CHECKS_LINE}  vapid: ✅"$'\n'
              else
                CHECKS_LINE="${CHECKS_LINE}  vapid: ⏭ not configured"$'\n'
              fi

              # Queue health summary
              QUEUES_STATUS=$(echo "$HEALTH" | jq -r ".checks.queues.status // empty")
              if [ -n "$QUEUES_STATUS" ]; then
                QUEUES_DETAIL=$(echo "$HEALTH" | jq -r ".checks.queues.detail // \"{}\"")
                TOTAL_FAILED=$(echo "$QUEUES_DETAIL" | jq '[.[].failed] | add // 0')
                TOTAL_ACTIVE=$(echo "$QUEUES_DETAIL" | jq '[.[].active] | add // 0')
                TOTAL_WAITING=$(echo "$QUEUES_DETAIL" | jq '[.[].waiting] | add // 0')
                if [ "$QUEUES_STATUS" = "ok" ]; then
                  CHECKS_LINE="${CHECKS_LINE}  queues: ✅ ${TOTAL_ACTIVE} active / ${TOTAL_WAITING} waiting / ${TOTAL_FAILED} failed"$'\n'
                else
                  CHECKS_LINE="${CHECKS_LINE}  queues: ⚠️ ${TOTAL_ACTIVE} active / ${TOTAL_WAITING} waiting / ${TOTAL_FAILED} failed"$'\n'
                fi
              fi
            else
              HEALTH_LINE="Health: ⚠️ unreachable"
            fi
          fi

          NL=$'\n'

          # Build the formatted message
          TEXT="${EMOJI} <b>sotto.fm ${STATUS}</b>${NL}"
          TEXT="${TEXT}<code>${PREV_SHA}</code> → <code>${COMMIT_SHA}</code>  <i>${COMMIT_MSG}</i>${NL}"
          TEXT="${TEXT}by ${AUTHOR}"

          # Append failure reason if any
          if [ -n "$FAIL_LINE" ]; then
            TEXT="${TEXT}${NL}${NL}⚠️ <b>${FAIL_LINE}</b>"
          fi

          # Build status section
          STATUS_LINES="${PITCH_LINE}"
          [ -n "$HEALTH_LINE" ] && STATUS_LINES="${STATUS_LINES}${NL}${HEALTH_LINE}"

          TEXT="${TEXT}${NL}${NL}<blockquote>${STATUS_LINES}</blockquote>"

          # Append service checks in expandable blockquote
          if [ -n "$CHECKS_LINE" ]; then
            TEXT="${TEXT}${NL}<blockquote expandable><b>Services</b>${NL}${CHECKS_LINE}</blockquote>"
          fi

          # Footer links
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="${TEXT}${NL}<a href=\"https://sotto.fm\">sotto.fm</a>  ·  <a href=\"https://sotto.fm/pitch\">Pitch</a>  ·  <a href=\"${RUN_URL}\">Run</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}')"
