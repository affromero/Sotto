name: Key Rotation Reminder

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  doppler-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Doppler reachable from VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: sotto
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/sotto

            echo "Checking Doppler CLI..."
            if ! command -v doppler &> /dev/null; then
              echo "::error::Doppler CLI not installed on VPS"
              exit 1
            fi

            echo "Verifying Doppler access..."
            SECRET_COUNT=$(doppler secrets --json 2>/dev/null | jq 'length')
            if [ "$SECRET_COUNT" -lt 1 ]; then
              echo "::error::Doppler returned no secrets — check service token"
              exit 1
            fi
            echo "Doppler OK: $SECRET_COUNT secrets configured"

            echo ""
            echo "=== Apple SIWA Client Secret Expiry Check ==="
            APPLE_SECRET=$(doppler secrets get APPLE_CLIENT_SECRET --plain 2>/dev/null || echo "")
            if [ -z "$APPLE_SECRET" ]; then
              echo "::warning::APPLE_CLIENT_SECRET not set in Doppler — Apple Sign In disabled"
            else
              # Decode JWT payload (base64url → base64 → json) and extract exp
              PAYLOAD=$(echo "$APPLE_SECRET" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)
              EXP=$(echo "$PAYLOAD" | jq -r '.exp' 2>/dev/null)
              if [ -n "$EXP" ] && [ "$EXP" != "null" ]; then
                NOW=$(date +%s)
                DAYS_LEFT=$(( (EXP - NOW) / 86400 ))
                EXP_DATE=$(date -d "@$EXP" +%Y-%m-%d 2>/dev/null || date -r "$EXP" +%Y-%m-%d 2>/dev/null)
                echo "Apple SIWA secret expires: $EXP_DATE ($DAYS_LEFT days left)"
                if [ "$DAYS_LEFT" -lt 30 ]; then
                  echo "::error::Apple SIWA secret expires in $DAYS_LEFT days! Run: node scripts/generate-apple-secret.mjs /path/to/AuthKey.p8"
                  exit 1
                elif [ "$DAYS_LEFT" -lt 60 ]; then
                  echo "::warning::Apple SIWA secret expires in $DAYS_LEFT days — rotate soon"
                fi
              else
                echo "::warning::Could not parse APPLE_CLIENT_SECRET expiry"
              fi
            fi

            echo ""
            echo "Review and rotate secrets at:"
            echo "  https://dashboard.doppler.com/workplace/projects/sotto/configs/prd"
