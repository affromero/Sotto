# Publishes the open-source Sotto images to GHCR.
#
# deploy.yml publishes separate maintainer production images tagged by full SHA.
# This workflow owns the public self-host image tags used by curl|bash.
name: Publish OSS image

on:
  push:
    branches: [main]
    # Conservative on purpose: skipping a publish that was needed is worse than
    # an extra build, so only changes that cannot reach the image are ignored.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

# Only the newest push to main needs its image published; an in-flight build for
# a commit that has already been superseded is publishing a stale tag.
concurrency:
  group: oss-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Stop docker/build-push-action uploading a *.dockerbuild record as an artifact on every run.
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'affromero/Sotto'
    runs-on: ubuntu-latest
    outputs:
      base_digest: ${{ steps.worker_base.outputs.digest }}
      short_sha: ${{ steps.sha.outputs.short }}
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify source
        run: |
          npm ci
          npm run ci

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build worker base candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers-base
          load: true
          tags: |
            ghcr.io/affromero/sotto-workers-base:${{ github.sha }}
            ghcr.io/affromero/sotto-workers-base:node22
          cache-from: type=gha,scope=sotto-workers-base
          cache-to: type=gha,mode=max,scope=sotto-workers-base

      - name: Verify and publish worker base
        id: worker_base
        run: |
          set -euo pipefail
          base="ghcr.io/affromero/sotto-workers-base:${{ github.sha }}"
          bash scripts/deploy/smoke-worker-base.sh "$base"
          docker push "$base"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base")
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
          docker push ghcr.io/affromero/sotto-workers-base:node22

      - name: Build sotto-web candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          build-args: |
            COMMIT_SHA=${{ steps.sha.outputs.short }}
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          tags: |
            ghcr.io/affromero/sotto-web:latest
            ghcr.io/affromero/sotto-web:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=sotto-web
          cache-to: type=gha,mode=max,scope=sotto-web

      - name: Verify and publish sotto-web
        run: |
          bash scripts/deploy/smoke-web-image.sh ghcr.io/affromero/sotto-web:${{ steps.sha.outputs.short }}
          docker push ghcr.io/affromero/sotto-web:${{ steps.sha.outputs.short }}
          docker push ghcr.io/affromero/sotto-web:latest

  workers:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build worker candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers
          load: true
          build-args: |
            WORKER_BASE_IMAGE=ghcr.io/affromero/sotto-workers-base@${{ needs.publish.outputs.base_digest }}
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/affromero/sotto-workers:latest
            ghcr.io/affromero/sotto-workers:${{ needs.publish.outputs.short_sha }}
          cache-from: type=gha,scope=sotto-workers
          cache-to: type=gha,mode=max,scope=sotto-workers
      - name: Verify worker runtime before publication
        run: bash scripts/deploy/smoke-worker-image.sh ghcr.io/affromero/sotto-workers:${{ needs.publish.outputs.short_sha }}
      - name: Publish verified worker
        run: |
          docker push ghcr.io/affromero/sotto-workers:${{ needs.publish.outputs.short_sha }}
          docker push ghcr.io/affromero/sotto-workers:latest
