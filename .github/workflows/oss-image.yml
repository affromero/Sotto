# Publishes the open-source Sotto images to GHCR.
#
# deploy.yml publishes separate maintainer production images tagged by full SHA.
# This workflow owns the public self-host image tags used by curl|bash.
name: Publish OSS image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Stop docker/build-push-action uploading a *.dockerbuild record as an artifact on every run.
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'affromero/Sotto'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release source
        run: |
          npm ci
          npm run ci

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push worker base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers-base
          push: true
          tags: |
            ghcr.io/affromero/sotto-workers-base:node22
          cache-from: type=gha,scope=sotto-workers-base
          cache-to: type=gha,mode=max,scope=sotto-workers-base

      - name: Build and push sotto-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ steps.sha.outputs.short }}
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          tags: |
            ghcr.io/affromero/sotto-web:latest
            ghcr.io/affromero/sotto-web:${{ steps.sha.outputs.short }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/affromero/sotto-web:{0}', github.ref_name) || '' }}
          cache-from: type=gha,scope=sotto-web
          cache-to: type=gha,mode=max,scope=sotto-web

      - name: Build and push sotto-workers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile.workers
          push: true
          build-args: |
            WORKER_BASE_IMAGE=ghcr.io/affromero/sotto-workers-base:node22
          tags: |
            ghcr.io/affromero/sotto-workers:latest
            ghcr.io/affromero/sotto-workers:${{ steps.sha.outputs.short }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/affromero/sotto-workers:{0}', github.ref_name) || '' }}
          cache-from: type=gha,scope=sotto-workers
          cache-to: type=gha,mode=max,scope=sotto-workers
