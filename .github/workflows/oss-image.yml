# Publishes the open-source Sotto images to GHCR.
#
# deploy.yml publishes separate maintainer production images tagged by full SHA.
# This workflow owns the public self-host image tags used by curl|bash. It needs
# the private learning-model submodule during the build, so it uses the same
# deploy key as CI. The curl|bash installer pulls these images.
name: Publish OSS image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (in addition to latest + sha)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push worker base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile.workers-base
          push: true
          tags: |
            ghcr.io/affromero/sotto-workers-base:node22
          cache-from: type=gha,scope=sotto-workers-base
          cache-to: type=gha,mode=max,scope=sotto-workers-base

      - name: Build and push sotto-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            COMMIT_SHA=${{ steps.sha.outputs.short }}
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          tags: |
            ghcr.io/affromero/sotto-web:latest
            ghcr.io/affromero/sotto-web:${{ steps.sha.outputs.short }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/affromero/sotto-web:{0}', github.ref_name) || '' }}
            ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('ghcr.io/affromero/sotto-web:{0}', inputs.tag) || '' }}
          cache-from: type=gha,scope=sotto-web
          cache-to: type=gha,mode=max,scope=sotto-web

      - name: Build and push sotto-workers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile.workers
          push: true
          build-args: |
            WORKER_BASE_IMAGE=ghcr.io/affromero/sotto-workers-base:node22
          tags: |
            ghcr.io/affromero/sotto-workers:latest
            ghcr.io/affromero/sotto-workers:${{ steps.sha.outputs.short }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/affromero/sotto-workers:{0}', github.ref_name) || '' }}
            ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('ghcr.io/affromero/sotto-workers:{0}', inputs.tag) || '' }}
          cache-from: type=gha,scope=sotto-workers
          cache-to: type=gha,mode=max,scope=sotto-workers
