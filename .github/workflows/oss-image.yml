# Public images consume the exact successful production source gate.
name: Publish OSS image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Preserve serialized public promotion and never interrupt a running release.
concurrency:
  group: oss-image
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: >-
      github.repository == 'affromero/Sotto' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.validation.outputs.runtime }}
    steps:
      - name: Find successful source validation for this exact main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          if [ -n "$SOURCE_RUN_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > delivery/source-run.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$RELEASE_SHA&status=success&per_page=100" > delivery/source-runs.json
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          single = Path('delivery/source-run.json')
          runs = [json.loads(single.read_text())] if single.exists() else json.loads(
              Path('delivery/source-runs.json').read_text())['workflow_runs']
          valid = [run for run in runs if (
              run.get('head_sha') == os.environ['RELEASE_SHA'] and
              run.get('head_branch') == 'main' and
              run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY'] and
              run.get('conclusion') == 'success' and
              run.get('status') == 'completed' and
              run.get('path') == '.github/workflows/ci.yml'
          )]
          if not valid:
              raise SystemExit('No successful production source gate exists for this exact main commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={valid[0]['id']}\n")
          PY
      - name: Download source validation from the verified run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gate.outputs.run_id }}
          name: source-validation-${{ env.RELEASE_SHA }}
          path: delivery/verified
      - name: Validate release revision and runtime scope
        id: validation
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          record = json.loads(Path('delivery/verified/source-validation.json').read_text())
          if (
              record.get('sha') != os.environ['RELEASE_SHA'] or
              type(record.get('runtime_changed')) is not bool or
              type(record.get('source_validated')) is not bool or
              (record['runtime_changed'] and not record['source_validated'])
          ):
              raise SystemExit('Source validation artifact does not match this release')
          manual = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          if manual and not record['source_validated']:
              raise SystemExit('Dispatch ci.yml on main to validate this commit before rebuilding images')
          runtime = manual or record['runtime_changed']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"runtime={str(runtime).lower()}\n")
          PY

  build:
    needs: source
    if: needs.source.outputs.runtime == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CANDIDATE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read locked Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node scripts/deploy/images/playwright-version.cjs)" >> "$GITHUB_ENV"
      - name: Build workers-base candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile.workers-base
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: PLAYWRIGHT_VERSION=${{ env.PLAYWRIGHT_VERSION }}
          tags: ghcr.io/affromero/sotto-workers-base:${{ env.CANDIDATE_TAG }}
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-workers-base:buildcache-oss-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-workers-base:buildcache-oss-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Verify and publish workers-base candidate
        run: |
          set -euo pipefail
          image="ghcr.io/affromero/sotto-workers-base:$CANDIDATE_TAG"
          bash scripts/deploy/smoke-worker-base.sh "$image"
          docker push "$image"
          mkdir -p digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$image" > digests/base.txt
      - name: Build web candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            COMMIT_SHA=${{ env.RELEASE_SHA }}
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          tags: ghcr.io/affromero/sotto-web:${{ env.CANDIDATE_TAG }}
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-web:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-web:buildcache-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Verify and publish web candidate
        run: |
          set -euo pipefail
          image="ghcr.io/affromero/sotto-web:$CANDIDATE_TAG"
          bash scripts/deploy/smoke-web-image.sh "$image"
          docker push "$image"
          mkdir -p digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$image" > digests/web.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oss-digests-web-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error
          retention-days: 1

  build-workers:
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CANDIDATE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: oss-digests-web-${{ matrix.arch }}
          path: digests
      - name: Read verified base digest
        id: worker_base
        run: echo "reference=$(cat digests/base.txt)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build workers candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile.workers
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            COMMIT_SHA=${{ env.RELEASE_SHA }}
            WORKER_BASE_IMAGE=${{ steps.worker_base.outputs.reference }}
          tags: ghcr.io/affromero/sotto-workers:${{ env.CANDIDATE_TAG }}
          cache-from: type=registry,ref=ghcr.io/affromero/sotto-workers:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/affromero/sotto-workers:buildcache-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Verify and publish workers candidate
        run: |
          set -euo pipefail
          image="ghcr.io/affromero/sotto-workers:$CANDIDATE_TAG"
          bash scripts/deploy/smoke-worker-image.sh "$image"
          docker push "$image"
          mkdir -p digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$image" > digests/workers.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oss-digests-workers-${{ matrix.arch }}
          path: digests/workers.txt
          if-no-files-found: error
          retention-days: 1

  verify-public:
    needs: build-workers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: oss-digests-*-${{ matrix.arch }}
          merge-multiple: true
          path: digests
      - name: Verify anonymous fresh install
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          bash scripts/ci/smoke-selfhost.sh "$(cat digests/web.txt)" "$(cat digests/workers.txt)" "$RELEASE_SHA"

  publish-release:
    needs: verify-public
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: oss-digests-*
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both tested architectures under release tags
        run: |
          set -euo pipefail
          for component in workers web; do
            image="ghcr.io/affromero/sotto-$component"
            docker buildx imagetools create \
              --tag "$image:${RELEASE_SHA::8}" \
              --tag "$image:$RELEASE_SHA" \
              "$(cat "digests/oss-digests-$component-amd64/$component.txt")" \
              "$(cat "digests/oss-digests-$component-arm64/$component.txt")"
          done

  verify-installer:
    needs: publish-release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Run the release installer without credentials or prompts
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          bash scripts/ci/smoke-installer.sh "$RELEASE_SHA"

  promote:
    needs: verify-installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote latest after both platform installers pass
        run: |
          set -euo pipefail
          for component in workers web; do
            image="ghcr.io/affromero/sotto-$component"
            docker buildx imagetools create --tag "$image:latest" "$image:$RELEASE_SHA"
          done

  verify-release:
    needs: promote
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Verify public latest manifests and matching revisions
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          for component in workers web; do
            image="ghcr.io/affromero/sotto-$component:latest"
            docker pull "$image"
            revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            architecture=$(docker image inspect --format '{{.Architecture}}' "$image")
            test "$revision" = "$RELEASE_SHA"
            test "$architecture" = "$EXPECTED_ARCH"
          done
      - name: Run the published installer without credentials or prompts
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          bash scripts/ci/smoke-installer.sh "$RELEASE_SHA" latest
