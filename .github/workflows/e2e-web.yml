name: E2E Web Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'e2e/playwright/**'
      - 'e2e/llmock/**'

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sotto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sotto_test?schema=public
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: e2e-test-secret-minimum-32-characters-long
      AUTH_SECRET: e2e-test-secret-minimum-32-characters-long
      NEXTAUTH_URL: http://localhost:3000
      BYOK_ENCRYPTION_KEY: e2e-test-encryption-key-must-be-32-hex-chars
      ANTHROPIC_BASE_URL: http://localhost:4100
      ANTHROPIC_API_KEY: sk-mock
      OPENAI_BASE_URL: http://localhost:4100
      GOOGLE_AI_BASE_URL: http://localhost:4100
      SKIP_DB_SYNC: '1'
      AI_PROVIDER: anthropic

    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/web/prisma/schema.prisma

      - name: Push schema to test DB
        run: npx prisma db push --schema=apps/web/prisma/schema.prisma --skip-generate

      - name: Seed test data
        run: npx tsx e2e/playwright/helpers/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright/playwright.config.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
