name: CI

# Production and OSS images consume this exact successful source validation.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    uses: ./.github/workflows/source-ci.yml

  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      source: ${{ steps.scope.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Select runtime image work
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess

          def runtime_path(path):
              if path.startswith('apps/web/'):
                  return not path.startswith('apps/web/tests/')
              if path.startswith(('packages/', 'services/', 'scripts/', 'vendor/', '.github/workflows/')):
                  return True
              return path in {
                  'package.json', 'package-lock.json', 'prisma.config.ts',
                  '.dockerignore', '.npmrc', '.gitmodules', '.node-version', 'Caddyfile',
                  '.env.example', '.env.oss.example',
              } or fnmatch.fnmatch(path, 'tsconfig*.json') or fnmatch.fnmatch(path, 'docker-compose*.yml')

          before = os.environ.get('BASE_SHA', '')
          head = os.environ['HEAD_SHA']
          runtime = True
          source = True
          if os.environ['EVENT_NAME'] in ('push', 'pull_request') and before and set(before) != {'0'}:
              comparison = f'{before}...{head}' if os.environ['EVENT_NAME'] == 'pull_request' else f'{before}..{head}'
              paths = subprocess.check_output([
                  'git', 'diff', '--no-renames', '--name-only', '-z', comparison,
              ]).decode().split('\0')
              runtime = any(runtime_path(path) for path in paths if path)
              source = runtime or any(
                  path.startswith('apps/web/') or fnmatch.fnmatch(path, 'vitest*.config.ts')
                  or path == '.pre-commit-config.yaml'
                  for path in paths if path
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"runtime={str(runtime).lower()}\n")
              output.write(f"source={str(source).lower()}\n")
          print(f"Backend source validation required: {source}; runtime images required: {runtime}")
          PY

  source-record:
    needs: [ci, changes]
    if: >-
      always() && github.repository == 'affromero/Sotto' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.ci.result == 'success' ||
       (needs.ci.result == 'skipped' &&
        needs.changes.outputs.source == 'false' &&
        needs.changes.outputs.runtime == 'false'))
    runs-on: ubuntu-latest
    steps:
      - name: Record successful source validation
        env:
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime }}
          SOURCE_VALIDATED: ${{ needs.ci.result == 'success' }}
        run: |
          mkdir -p delivery
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('delivery/source-validation.json').write_text(json.dumps({
              'sha': os.environ['GITHUB_SHA'],
              'runtime_changed': os.environ['RUNTIME_CHANGED'] == 'true',
              'source_validated': os.environ['SOURCE_VALIDATED'] == 'true',
          }) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-validation-${{ github.sha }}
          path: delivery/source-validation.json
          if-no-files-found: error
          retention-days: 14
