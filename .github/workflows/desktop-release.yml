name: Desktop launcher release

# Builds Sotto Host (apps/desktop) for macOS, Windows, and Linux and publishes the
# installers to R2 — the bucket that sotto.fm uses for /download desktop assets.
# Each build publishes both a release-version path and a short-commit path, so
# users can pin a desktop build without requiring a package version bump.
# Trigger by pushing a tag like `v0.1.0` or `desktop-v0.1.0`, or run manually.
on:
  push:
    tags: ['v*', 'desktop-v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version path to publish, for example v0.1.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'affromero/Sotto'
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
      short_sha: ${{ steps.release_version.outputs.short_sha }}
      should_build: ${{ steps.release_version.outputs.should_build }}
      skip_reason: ${{ steps.release_version.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail

          RAW_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}"
          if [ -z "$RAW_VERSION" ] || [ "$RAW_VERSION" = "main" ]; then
            RAW_VERSION="v$(node -p "require('./apps/desktop/package.json').version")"
          fi

          RELEASE_VERSION="${RAW_VERSION#desktop-}"
          case "$RELEASE_VERSION" in
            v*) ;;
            *) RELEASE_VERSION="v$RELEASE_VERSION" ;;
          esac

          DESKTOP_VERSION="v$(node -p "require('./apps/desktop/package.json').version")"
          SHOULD_BUILD=true
          SKIP_REASON=""
          if [ "${{ github.event_name }}" = "push" ] && [ "$RELEASE_VERSION" != "$DESKTOP_VERSION" ]; then
            SHOULD_BUILD=false
            SKIP_REASON="Skipping desktop release: tag $RELEASE_VERSION does not match apps/desktop package version $DESKTOP_VERSION."
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$SKIP_REASON" >> "$GITHUB_OUTPUT"

      - name: Explain skipped desktop release
        if: steps.release_version.outputs.should_build != 'true'
        run: echo "${{ steps.release_version.outputs.skip_reason }}"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            slug: mac
          - os: windows-latest
            slug: windows
          - os: ubuntu-latest
            slug: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install + generate icons
        working-directory: apps/desktop
        run: |
          npm ci
          npm run icon

      # Builds the installer for the current OS. Add signing secrets here to
      # produce a signed/notarized build (see apps/desktop/README.md).
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: apps/desktop

      - name: Normalize desktop artifacts
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ needs.prepare.outputs.release_version }}"
          SHORT_SHA="${{ needs.prepare.outputs.short_sha }}"
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          ARTIFACT_ROOT="$RUNNER_TEMP/sotto-desktop-downloads"
          VERSION_DIR="$ARTIFACT_ROOT/download/desktop/$RELEASE_VERSION/${{ matrix.slug }}"
          SHA_DIR="$ARTIFACT_ROOT/download/desktop/$SHORT_SHA/${{ matrix.slug }}"
          LATEST_DIR="$ARTIFACT_ROOT/download/desktop/latest/${{ matrix.slug }}"

          mkdir -p "$VERSION_DIR" "$SHA_DIR" "$LATEST_DIR"

          files=()
          case "${{ matrix.slug }}" in
            mac)
              while IFS= read -r file; do files+=("$file"); done < <(find "$BUNDLE_DIR" -type f -name '*.dmg' | sort)
              ;;
            windows)
              while IFS= read -r file; do files+=("$file"); done < <(find "$BUNDLE_DIR" -type f \( -name '*.msi' -o -name '*.exe' \) | sort)
              ;;
            linux)
              while IFS= read -r file; do files+=("$file"); done < <(find "$BUNDLE_DIR" -type f \( -name '*.AppImage' -o -name '*.deb' \) | sort)
              ;;
          esac

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer artifacts found under $BUNDLE_DIR for ${{ matrix.slug }}" >&2
            exit 1
          fi

          primary=""
          case "${{ matrix.slug }}" in
            mac)
              primary="${files[0]}"
              ;;
            windows)
              for file in "${files[@]}"; do
                if [[ "$file" == *.msi ]]; then primary="$file"; break; fi
              done
              primary="${primary:-${files[0]}}"
              ;;
            linux)
              for file in "${files[@]}"; do
                if [[ "$file" == *.AppImage ]]; then primary="$file"; break; fi
              done
              primary="${primary:-${files[0]}}"
              ;;
          esac

          case "$primary" in
            *.dmg)
              fixed_name="sotto-host-$RELEASE_VERSION-mac.dmg"
              content_type="application/x-apple-diskimage"
              ;;
            *.msi)
              fixed_name="sotto-host-$RELEASE_VERSION-windows.msi"
              content_type="application/x-msi"
              ;;
            *.exe)
              fixed_name="sotto-host-$RELEASE_VERSION-windows.exe"
              content_type="application/vnd.microsoft.portable-executable"
              ;;
            *.AppImage)
              fixed_name="sotto-host-$RELEASE_VERSION-linux.AppImage"
              content_type="application/octet-stream"
              ;;
            *.deb)
              fixed_name="sotto-host-$RELEASE_VERSION-linux.deb"
              content_type="application/vnd.debian.binary-package"
              ;;
            *)
              echo "Unsupported primary installer artifact: $primary" >&2
              exit 1
              ;;
          esac

          for file in "${files[@]}"; do
            cp "$file" "$VERSION_DIR/$(basename "$file")"
          done
          cp "$primary" "$VERSION_DIR/$fixed_name"

          node - "$VERSION_DIR/manifest.json" "$RELEASE_VERSION" "$SHORT_SHA" "$GITHUB_SHA" "${{ matrix.slug }}" "$fixed_name" "$content_type" <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const [manifestPath, version, shortSha, commitSha, platform, primaryFilename, contentType] = process.argv.slice(2);
          const dir = path.dirname(manifestPath);
          const fileNames = fs.readdirSync(dir).filter((name) => name !== 'manifest.json').sort();
          const files = fileNames.map((filename) => {
            const stat = fs.statSync(path.join(dir, filename));
            return { filename, href: filename, size: stat.size };
          });
          const primary = files.find((file) => file.filename === primaryFilename);
          if (!primary) throw new Error(`Primary artifact missing: ${primaryFilename}`);

          const manifest = {
            version,
            commit: { short: shortSha, sha: commitSha },
            platform,
            primary: { ...primary, contentType },
            files,
            generatedAt: new Date().toISOString(),
          };

          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          cp -R "$VERSION_DIR"/. "$LATEST_DIR"/
          cp -R "$VERSION_DIR"/. "$SHA_DIR"/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sotto-host-${{ matrix.slug }}-${{ needs.prepare.outputs.release_version }}
          path: ${{ runner.temp }}/sotto-desktop-downloads/download/desktop/${{ needs.prepare.outputs.release_version }}/${{ matrix.slug }}/*
          # Handoff to the release job only; binaries live permanently on R2 + the GitHub Release.
          retention-days: 1

      # Publish the produced bundles to R2 so sotto.fm/download can serve them.
      - name: Upload installers to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ENDPOINT:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 release upload secrets are not configured; skipping R2 upload."
            exit 0
          fi

          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          aws s3 cp "$BUNDLE_DIR" "s3://$R2_BUCKET/download/${{ matrix.slug }}/" \
            --recursive --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*.dmg" --include "*.msi" --include "*.exe" \
            --include "*.AppImage" --include "*.deb"
          aws s3 cp "$RUNNER_TEMP/sotto-desktop-downloads/download/desktop" "s3://$R2_BUCKET/download/desktop/" \
            --recursive --endpoint-url "$R2_ENDPOINT"

  release:
    name: Attach desktop installers to GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.should_build == 'true' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#desktop-}"
          VERSION="${VERSION#v}"

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; print; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > changelog-section.md

          if [ ! -s changelog-section.md ]; then
            echo "CHANGELOG.md is missing release notes for $VERSION" >&2
            exit 1
          fi

          cp changelog-section.md release-notes.md
          cat >> release-notes.md <<'EOF'

          Desktop installers are attached to this release. The same files are published for website download links under:

          - `/download/desktop/<version>/<platform>/`
          - `/download/desktop/<short-sha>/<platform>/`
          - `/download/desktop/latest/<platform>/`
          EOF

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          body_path: release-notes.md
