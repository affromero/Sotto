name: sotto TUI release

# Builds the `sotto` terminal client (the Rust crate in tui/) for Linux and
# macOS, packages per-target tar.gz + sha256, and attaches them to a GitHub
# Release. Trigger by pushing a tag like `sotto-v0.1.0` — a TUI-specific prefix
# so it never collides with the web app or the desktop launcher (`desktop-v*`).
#
# Audio note: cpal/rodio link to the system audio stack (ALSA on Linux,
# CoreAudio on macOS). A fully static musl + audio binary is NOT produced
# because the audio backend links system libraries; the Linux builds are gnu
# (dynamically linked against libasound). See tui/README.md.
on:
  push:
    tags: ['sotto-v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: tui

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # The TUI build reads only tui/ (the OpenAPI spec is vendored in-crate), so
      # no submodules are needed.
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux audio + cross-compile deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: ALSA headers for cpal/rodio.
          sudo apt-get install -y libasound2-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            # Point ALSA's build to the arm64 sysroot for the cross link.
            sudo dpkg --add-architecture arm64
            sudo apt-get update || true
            sudo apt-get install -y libasound2-dev:arm64 || true
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz + sha256)
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          ARCHIVE="sotto-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$BIN_DIR" sotto
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "Built artifacts:"
          ls -l "$ARCHIVE" "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: sotto-${{ matrix.target }}
          path: |
            tui/sotto-${{ matrix.target }}.tar.gz
            tui/sotto-${{ matrix.target }}.tar.gz.sha256
          # Handoff to the release job only; binaries live permanently on the GitHub Release.
          retention-days: 1

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # No working-directory override needed; this job only moves artifacts.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            `sotto` terminal client — prebuilt binaries.

            Each `sotto-<target>.tar.gz` contains the `sotto` binary; verify with the
            matching `.sha256`. Install: extract and move `sotto` onto your `PATH`.
            See [tui/README.md](https://github.com/affromero/Sotto/blob/main/tui/README.md).
