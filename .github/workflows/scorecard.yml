name: Scorecard supply-chain security

# OpenSSF Scorecard scores the repository's security posture (branch protection,
# token permissions, dependency pinning, dangerous workflows, and more) and
# publishes the result to the public OSSF dashboard, which backs the README
# badge. Runs on pushes to main, weekly, and when branch-protection rules change.
on:
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: ['main']

# Least privilege by default; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
