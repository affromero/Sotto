name: CodeQL

# Static security analysis (code scanning) for the JavaScript/TypeScript sources.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published CodeQL queries catch issues even without a push.
    - cron: '0 7 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Code scanning needs a public repo or GitHub Advanced Security, so it fails
    # while this repo is private. Skip it until the repo is public; the job then
    # activates automatically (no further change needed).
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Submodules are private; skip them — CodeQL only needs the app sources.
          submodules: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # The extended suite adds more security queries than the default.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
