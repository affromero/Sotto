name: gitleaks

# Secret scanning: fails any pull request or push that introduces a committed
# key, token, or credential. Automatic runs (pull_request, push) scan only the
# event's commit range, so they guard new secrets without flagging historical
# fixtures; workflow_dispatch runs a full-history audit on demand.
# gitleaks-action is free for public repositories, so no license key is required.
on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists the PR's commits via the API to scan only the event's
  # range; without pull-requests:read that call 403s and fails the job.
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
