name: Server Logs

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to fetch logs from'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - workers-heavy
          - workers-pipeline
          - workers-light
          - workers-all
          - infra
          - all
      lines:
        description: 'Number of log lines'
        required: true
        default: '200'
        type: string

jobs:
  fetch-logs:
    name: Fetch & Send Logs
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key

          SERVICE="${{ inputs.service }}"
          LINES="${{ inputs.lines }}"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key sotto@${{ secrets.SERVER_IP }} "
            cd ~/sotto
            case '$SERVICE' in
              web)
                # Fetch from whichever blue/green slot is active
                ACTIVE=\$(cat ~/.sotto-deploy-slot 2>/dev/null || echo blue)
                docker compose -f docker-compose.app.yml -p sotto-\${ACTIVE} logs --tail=${LINES} --timestamps web 2>&1
                ;;
              workers-heavy)
                docker compose -f docker-compose.workers.yml logs --tail=${LINES} --timestamps workers-heavy 2>&1
                ;;
              workers-pipeline)
                docker compose -f docker-compose.workers.yml logs --tail=${LINES} --timestamps workers-pipeline 2>&1
                ;;
              workers-light)
                docker compose -f docker-compose.workers.yml logs --tail=${LINES} --timestamps workers-light 2>&1
                ;;
              workers-all)
                docker compose -f docker-compose.workers.yml logs --tail=${LINES} --timestamps 2>&1
                ;;
              infra)
                docker compose -f docker-compose.infra.yml logs --tail=${LINES} --timestamps 2>&1
                ;;
              all)
                ACTIVE=\$(cat ~/.sotto-deploy-slot 2>/dev/null || echo blue)
                docker compose -f docker-compose.infra.yml logs --tail=${LINES} --timestamps 2>&1
                docker compose -f docker-compose.app.yml -p sotto-\${ACTIVE} logs --tail=${LINES} --timestamps 2>&1
                docker compose -f docker-compose.workers.yml logs --tail=${LINES} --timestamps 2>&1
                ;;
            esac
          " > logs.txt 2>&1 || true

          rm -f ~/.ssh/key

          # Fallback if empty
          if [ ! -s logs.txt ]; then
            echo "No log output returned." > logs.txt
          fi

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SERVICE="${{ inputs.service }}"
          LINES="${{ inputs.lines }}"
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@logs.txt;filename=sotto-${SERVICE}-${LINES}.log" \
            -F "caption=Server logs: ${SERVICE} (last ${LINES} lines) — ${TS}"
