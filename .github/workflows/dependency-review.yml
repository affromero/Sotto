name: Dependency Review

# Blocks a pull request that adds a dependency with a known high-severity
# vulnerability or an incompatible license, before it reaches main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    # The Dependency Review API needs Dependency Graph + GitHub Advanced Security,
    # so it fails on a private repo. Skip until the repo is public; runs then.
    if: ${{ !github.event.repository.private }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
