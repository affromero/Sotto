name: Browser journeys

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/browser.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/browser.yml'

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Learner browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIDEDOOR_TEST_DATABASE_URL: postgresql://postgres:browser-test-only@127.0.0.1:5432/sidedoor_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: browser-test-only
          POSTGRES_DB: sidedoor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sidedoor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-traces
          path: |
            test-results/browser
            playwright-report
          retention-days: 7
