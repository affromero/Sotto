name: E2E Mobile Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'e2e/maestro/**'

jobs:
  e2e-mobile:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      - name: Prebuild iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Build for simulator
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Sotto.xcworkspace \
            -scheme Sotto \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            build

      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl list devices booted

      - name: Install app on simulator
        run: |
          APP_PATH=$(find apps/mobile/ios/build -name "*.app" -type d | head -1)
          xcrun simctl install booted "$APP_PATH"

      - name: Start LLMock server
        run: |
          npx tsx e2e/llmock/setup.ts &
          sleep 2

      - name: Run Maestro tests
        env:
          MAESTRO_HOME: ${{ github.workspace }}/.maestro
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test e2e/maestro/flows/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: ~/.maestro/tests/
          retention-days: 7
