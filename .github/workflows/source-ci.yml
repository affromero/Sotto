name: Source validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://selfhost.example.com
      SIDEDOOR_TEST_DATABASE_URL: postgresql://postgres:sidedoor-test-only@127.0.0.1:5432/sidedoor_test
      SIDEDOOR_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_URL: redis://127.0.0.1:6379/14
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sidedoor-test-only
          POSTGRES_DB: sidedoor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sidedoor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tools
        run: |
          sudo test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools qpdf redis-server
      - run: npx --no-install prisma generate --schema=apps/web/prisma/schema.prisma
      - name: Validate web application
        run: npm run ci:web

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate shared packages
        run: npm run ci:packages

  tooling:
    name: Repository tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Type-check deployment Python
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.11.17/install.sh | sh
          "$HOME/.local/bin/uvx" --from mypy==2.4.0 mypy --strict --explicit-package-bases --python-version 3.12 scripts/deploy/images scripts/deploy/review scripts/deploy/compatibility-review.py
      - name: Audit dependencies
        run: node scripts/ci/audit-gate.mjs
      - name: Validate repository tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test*.py'
      - name: Validate native link and integration tooling
        run: node --test scripts/play/validate-associations.test.mjs e2e/native/*.test.mjs
      - name: Verify PostgreSQL backup and restore
        env:
          SOTTO_TEST_POSTGRES: '1'
        run: python3 -m unittest discover -s scripts/tests -p test_database_command.py

  speech:
    name: Local speech
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive
      - name: Verify local speech services
        working-directory: services/local-tts
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.11.17/install.sh | sh
          "$HOME/.local/bin/uv" sync --locked --python 3.11
          "$HOME/.local/bin/uv" run pytest
          "$HOME/.local/bin/uv" run pytest ../local-stt/tests
          "$HOME/.local/bin/uv" run ruff check .
          "$HOME/.local/bin/uv" run ruff format --check .
          "$HOME/.local/bin/uv" run ruff check ../local-stt
          "$HOME/.local/bin/uv" run ruff format --check ../local-stt

  source:
    name: Lint, Type Check, Test & Build
    if: always()
    needs: [web, packages, tooling, speech]
    runs-on: ubuntu-latest
    steps:
      - name: Require every source validation gate
        env:
          SOURCE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['SOURCE_JOB_RESULTS'])
          expected = {'web', 'packages', 'tooling', 'speech'}
          if set(results) != expected:
              raise SystemExit('Source validation returned unexpected gates.')
          failed = {
              name: results[name].get('result')
              for name in sorted(expected)
              if results[name].get('result') != 'success'
          }
          if failed:
              raise SystemExit(f'Source validation did not pass: {failed}')
          print('Every source validation gate passed for this revision.')
          PY
